# Deploy the trip app to GitHub Pages — explicit workflow
# Replaces the flaky automatic "pages build and deployment" pipeline.
# Lives at: .github/workflows/static.yml
name: Deploy static site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:   # gives you a manual "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

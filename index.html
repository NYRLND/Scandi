const ODO_LBL={p:"✈ Plane",f:"⛴ Boat & ferry",t:"🚂 Train",b:"🚌 Bus",m:"Ⓜ Metro",w:"👟 On foot"};
function odoThrough(dateISO){const out={p:0,f:0,t:0,b:0,m:0,w:0};
 Object.entries(ODO).forEach(([d,v])=>{if(d<=dateISO)Object.entries(v).forEach(([k,km])=>out[k]+=km)});
 out.total=Object.keys(ODO_LBL).reduce((a,k)=>a+out[k],0);return out}
function odoDay(dateISO){return ODO[dateISO]||{}}

/* ---- daily dispatch ---- */
function dispatchText(day){
 const i=DATA.indexOf(day),dk=day.d;
 const W=wxGet(),wk=WXDAY[dk],rec=W.data&&W.data[wk]&&W.data[wk][dk];
 const dz=odoDay(dk),cum=odoThrough(dk);
 const dparts=Object.entries(dz).map(([k,km])=>`${ODO_LBL[k].split(" ").slice(1).join(" ")||k} ~${km} km`);
 const finds=huntToday();
 const quotes=Object.values(S.log).filter(e=>e.d===dk&&e.t).sort((a,b)=>a.ts-b.ts);
 let L=[];
 L.push(`${dk<"2026-07-24"?"🇳🇴":"🇩🇰"} Scandinavia — Day ${i+1} of 21 · ${day.dow} ${fmtDate(dk)}`);
 L.push(`📍 ${day.city}`);
 if(day.sub)L.push(day.sub);
 if(rec)L.push(`☁️ ${Math.round(rec.lo)}–${Math.round(rec.hi)}°F, ${rec.p}% rain`);
 if(dparts.length)L.push(`🧭 Today: ${dparts.join(" · ")} — trip total ~${Math.round(cum.total).toLocaleString()} km`);
 if(finds.length)L.push(`✦ Hunt finds: ${finds.map(f=>f.t+" ("+(f.w==="B"?"both boys":f.w==="G"?"Gavin":"Declan")+")").join("; ")}`);
 quotes.slice(0,4).forEach(q=>L.push(`💬 "${q.t}" — ${q.w}`));
 L.push(`— Dan, Melissa, Gavin & Declan`);
 return L.join("\n")}
window.copyDispatch=async()=>{const t=dispatchText(DATA[curDay]);
 try{await navigator.clipboard.writeText(t);toast("Dispatch copied — paste into WhatsApp, add today's photos")}catch(e){prompt("Copy:",t)}};
window.shareDispatch=async()=>{const t=dispatchText(DATA[curDay]);
 if(navigator.share){try{await navigator.share({text:t})}catch(e){}}else copyDispatch()};

/* ---- cover card (canvas, nautical style, no photos — real photos follow in the album) ---- */
window.makeCard=async()=>{
 const day=DATA[curDay],i=curDay,dk=day.d;
 const cv=document.createElement("canvas");cv.width=1080;cv.height=1350;const x=cv.getContext("2d");
 const C={paper:"#EFE6D2",ink:"#1E3140",ink2:"#5B6B78",red:"#A5442A",sea:"#2E6E62",gold:"#B98A2F"};
 x.fillStyle=C.paper;x.fillRect(0,0,1080,1350);
 x.strokeStyle=C.ink;x.lineWidth=6;x.strokeRect(36,36,1008,1278);
 x.lineWidth=1.5;x.strokeRect(52,52,976,1246);
 x.setLineDash([2,7]);x.lineWidth=2;x.strokeStyle=C.ink2;x.strokeRect(70,70,940,1210);x.setLineDash([]);
 x.fillStyle=C.ink2;x.font="600 30px Georgia";x.textAlign="center";x.letterSpacing="10px";
 x.fillText("THE RYAN FAMILY · SCANDINAVIA 2026",540,150);x.letterSpacing="0px";
 x.fillStyle=C.red;x.font="700 34px Georgia";
 x.fillText("DAY "+(i+1)+" OF 21  ·  "+day.dow.toUpperCase()+" "+fmtDate(dk).toUpperCase(),540,215);
 x.fillStyle=C.ink;x.font="700 92px Georgia";
 const city=day.city.replace(/→/g,"→");
 x.font=city.length>16?"700 64px Georgia":"700 92px Georgia";
 x.fillText(city,540,330);
 x.fillStyle=C.ink2;x.font="italic 34px Georgia";
 wrapText(x,day.sub||"",540,392,860,44);
 // compass rose
 const cx=540,cy=640,R=150;
 x.strokeStyle=C.ink;x.lineWidth=3;x.beginPath();x.arc(cx,cy,R,0,7);x.stroke();
 x.lineWidth=1;x.beginPath();x.arc(cx,cy,R-14,0,7);x.stroke();
 for(let a=0;a<8;a++){const th=a*Math.PI/4,long=a%2===0;
  x.save();x.translate(cx,cy);x.rotate(th);
  x.fillStyle=long?C.ink:C.red;x.beginPath();
  x.moveTo(0,-(long?R-20:R-52));x.lineTo(12,0);x.lineTo(-12,0);x.closePath();x.fill();x.restore()}
 x.fillStyle=C.paper;x.beginPath();x.arc(cx,cy,26,0,7);x.fill();
 x.strokeStyle=C.ink;x.lineWidth=2.5;x.beginPath();x.arc(cx,cy,26,0,7);x.stroke();
 x.fillStyle=C.ink;x.font="700 44px Georgia";x.fillText("N",cx,cy-R-24);
 // stats band
 const cum=odoThrough(dk),finds=huntToday(),nlog=Object.values(S.log).filter(e=>e.d===dk).length;
 const stats=[["~"+Math.round(cum.total).toLocaleString()+" km","traveled so far"],
  [String(finds.length),"hunt finds today"],
  [String(nlog),nlog===1?"memory logged":"memories logged"]];
 let sx=540-330;
 x.textAlign="center";
 stats.forEach(s=>{x.fillStyle=C.sea;x.font="700 56px Georgia";x.fillText(s[0],sx,900);
  x.fillStyle=C.ink2;x.font="26px Georgia";x.fillText(s[1].toUpperCase(),sx,940);sx+=330});
 // per-mode line
 x.fillStyle=C.ink2;x.font="28px Georgia";
 const modes=Object.keys(ODO_LBL).filter(k=>cum[k]>0).map(k=>ODO_LBL[k]+" ~"+Math.round(cum[k]).toLocaleString());
 wrapText(x,modes.join("   ·   "),540,1010,880,38);
 // footer
 x.fillStyle=C.red;x.font="italic 700 40px Georgia";
 x.fillText(dk<"2026-07-24"?"Hilsen fra Norge!":"Hilsner fra København!",540,1180);
 x.fillStyle=C.ink2;x.font="24px Georgia";
 x.fillText("· real photos follow ·",540,1230);
 cv.toBlob(async b=>{
  try{const f=new File([b],"day"+(i+1)+"-card.jpg",{type:"image/jpeg"});
   if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){}
  const box=document.getElementById("cardBox");
  if(box){box.style.display="block";box.innerHTML='<img style="max-width:100%;border-radius:12px" src="'+cv.toDataURL("image/jpeg",0.9)+'"><div class="small" style="margin-top:6px">Long-press the card to save, then attach it first in WhatsApp.</div>'}
 },"image/jpeg",0.9)};
function wrapText(x,text,cx,y,maxW,lh){const words=(text||"").split(" ");let line="";
 words.forEach(w=>{const t=line?line+" "+w:w;
  if(x.measureText(t).width>maxW&&line){x.fillText(line,cx,y);y+=lh;line=w}else line=t});
 if(line)x.fillText(line,cx,y)}

/* ---- tap-to-call ---- */
const telify=t=>(t||"").replace(/\+4[57][\d ]{7,13}\d/g,m=>`<a href="tel:${m.replace(/ /g,"")}" style="color:var(--ink);font-weight:700;text-decoration:underline dotted">${m}</a>`);
const telShort=t=>(t||"").replace(/\b(110|112|113|1813|116 117)\b/g,m=>`<a href="tel:${m.replace(/ /g,"")}" style="color:var(--ink);font-weight:700;text-decoration:underline dotted">${m}</a>`);

/* ---- QR sync ---- */
function syncPayload(){return "RYANTRIPZ:"+LZString.compressToEncodedURIComponent(JSON.stringify(S))}
window.showQR=()=>{
 const box=document.getElementById("qrBox");if(!box)return;
 if(box.style.display==="block"){box.style.display="none";return}
 const p=syncPayload();
 if(p.length>2800){box.style.display="block";box.innerHTML=`<div class="qrCap">Too many notes for one QR (${p.length} chars) — use “Share as text” instead.</div>`;return}
 try{const q=qrcode(0,"L");q.addData(p,"Byte");q.make();
  box.style.display="block";
  box.innerHTML=q.createSvgTag({cellSize:4,margin:6})+`<div class="qrCap"><b>Other phone:</b> open the iPhone <b>Camera</b> app, point it here, tap the text banner, <b>Copy</b> — then in this app: More → Import → paste. Works with zero signal.</div>`;
 }catch(e){box.style.display="block";box.innerHTML=`<div class="qrCap">QR failed to build — use “Share as text”.</div>`}};
function mergeState(inc){
 ["done","notes","edits","hidden","prep","hunt","hdate","prizes","co","log","custom"].forEach(f=>{if(inc[f]){S[f]=S[f]||{};Object.assign(S[f],inc[f])}});
 if(inc.rate)S.rate=inc.rate;store.save(S)}

/* actions */
window.toggleDone=k=>{S.done[k]=!S.done[k];store.save(S);render(true)};
window.saveNote=v=>{S.notes[curDay]=v;store.save(S)};
window.stepDay=n=>{curDay=Math.min(DATA.length-1,Math.max(0,curDay+n));render()};
window.goToday=()=>{curDay=todayIdx();render()};
window.toggleEdit=()=>{editing=!editing;render()};
window.editItem=(k,di,bi,ii,isCustom)=>{
 const ed=S.edits[k]||{};let base;
 if(isCustom){const list=S.custom[di+"."+bi]||[];base=list[parseInt(ii.slice(1))]||{}}
 else base=DATA[di].blocks[bi].items[ii];
 const nb=prompt("Title (blank = hide this item, or keep):",ed.b??base.b??"");
 if(nb===null)return;
 if(nb.trim()===""){S.hidden[k]=!S.hidden[k];store.save(S);render();return}
 const nd=prompt("Details:",ed.d??base.d??"");if(nd===null)return;
 S.edits[k]={b:nb,d:nd};store.save(S);render()};
window.addItem=(di,bi)=>{
 const b=prompt("New item title:");if(!b)return;
 const d=prompt("Details (optional):")||"";
 const key=di+"."+bi;S.custom[key]=S.custom[key]||[];S.custom[key].push({b,d});store.save(S);render()};
window.copyText=t=>{navigator.clipboard&&navigator.clipboard.writeText(t)};
window.exportState=()=>{
 const p=syncPayload();
 if(navigator.share){navigator.share({title:"Trip app sync",text:p}).catch(()=>{})}
 else{navigator.clipboard.writeText(p);alert("Copied to clipboard — paste it to the other phone via iMessage.")}};
window.importState=()=>{
 const t=prompt("Paste the sync text (from QR-copy or iMessage):");if(!t)return;
 try{const raw=t.trim();let s;
  if(raw.startsWith("RYANTRIPZ:"))s=JSON.parse(LZString.decompressFromEncodedURIComponent(raw.slice(10)));
  else if(raw.startsWith("RYANTRIP:"))s=JSON.parse(decodeURIComponent(escape(atob(raw.slice(9)))));
  else throw 0;
  mergeState(s);render();alert("Imported and merged — check-offs, notes and hunt scores from the other phone are in.")}
 catch(e){alert("That didn't parse — make sure the whole text was pasted, from the start (RYANTRIPZ:).")}};
function wireConverter(){
 const f=()=>{const a=parseFloat($("#cvAmt").value)||0,c=$("#cvCur").value;
  S.rate.nok=parseFloat($("#rNok").value)||10;S.rate.dkk=parseFloat($("#rDkk").value)||6.9;store.save(S);
  const r=c==="nok"?S.rate.nok:S.rate.dkk;
  $("#cvOut").textContent=a+" "+c.toUpperCase()+" ≈ $"+(a/r).toFixed(2)+" USD"};
 ["cvAmt","cvCur","rNok","rDkk"].forEach(id=>$("#"+id).addEventListener("input",f));f()}

/* ---- live weather (Open-Meteo, no key, cached 3h for offline) ---- */
const WXPT={avl:[35.5951,-82.5515],bgo:[60.3913,5.3221],bal:[61.2086,6.5366],flm:[60.8630,7.1130],lof:[60.3283,6.6603],osl:[59.9139,10.7522],dro:[59.6633,10.6290],cph:[55.6761,12.5683]};
const WXDAY={"2026-07-07":"avl","2026-07-08":"bgo","2026-07-09":"bgo","2026-07-10":"bgo","2026-07-11":"bal","2026-07-12":"bal","2026-07-13":"bal","2026-07-14":"flm","2026-07-15":"lof","2026-07-16":"lof","2026-07-17":"osl","2026-07-18":"osl","2026-07-19":"osl","2026-07-20":"dro","2026-07-21":"dro","2026-07-22":"dro","2026-07-23":"osl","2026-07-24":"cph","2026-07-25":"cph","2026-07-26":"cph","2026-07-27":"cph"};
function wxIcon(c){if(c===0)return"☀️";if(c<=2)return"🌤️";if(c===3)return"☁️";if(c<=48)return"🌫️";if(c<=57)return"🌦️";if(c<=67)return"🌧️";if(c<=77)return"🌨️";if(c<=82)return"🌧️";if(c<=86)return"🌨️";return"⛈️"}
function wxGet(){try{return JSON.parse(localStorage.getItem("rt26.wx")||"{}")}catch(e){return{}}}
function wxHTML(day){
 const W=wxGet(),k=WXDAY[day.d],rec=W.data&&W.data[k]&&W.data[k][day.d];
 if(!rec)return"";
 let h=`<div class="wx"><span>${wxIcon(rec.c)}</span><b>${Math.round(rec.lo)}–${Math.round(rec.hi)}°F</b><span>· ${rec.p}% rain</span><span style="opacity:.55;font-size:11.5px">${W.at?new Date(W.at).toLocaleDateString(undefined,{month:"short",day:"numeric"})+" fcst":""}</span></div>`;
 if(rec.p>=50)h+=`<div class="wxHint">☂ <b>Rain likely.</b> ${esc(day.rain||"Lean on this day's italic alternates — they're the indoor pivots.")}</div>`;
 return h}
async function wxFetch(force){
 if(!navigator.onLine)return;
 const W=wxGet();
 if(!force&&W.at&&Date.now()-W.at<3*3600*1000)return;
 const out={};
 await Promise.all(Object.entries(WXPT).map(async([k,pt])=>{
  try{
   const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${pt[0]}&longitude=${pt[1]}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&temperature_unit=fahrenheit&forecast_days=16`);
   const j=await r.json();const m={};
   (j.daily&&j.daily.time||[]).forEach((d,i)=>{m[d]={c:j.daily.weather_code[i],hi:j.daily.temperature_2m_max[i],lo:j.daily.temperature_2m_min[i],p:j.daily.precipitation_probability_max[i]??0}});
   out[k]=m;
  }catch(e){}
 }));
 if(Object.keys(out).length){localStorage.setItem("rt26.wx",JSON.stringify({at:Date.now(),data:out}));if(curTab==="day")render()}}

document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{curTab=b.dataset.tab;editing=false;render()});
window.addEventListener("online",()=>{document.body.classList.remove("offline");wxFetch()});
window.addEventListener("offline",()=>document.body.classList.add("offline"));
if(!navigator.onLine)document.body.classList.add("offline");
curDay=todayIdx();render();wxFetch();
setInterval(()=>{if(curTab==="day"){const c=document.querySelector(".count");if(c)c.outerHTML=countdownHTML();
 const ch=document.getElementById("chainSec");if(ch)ch.outerHTML=transitHTML(DATA[curDay],`var(--${DATA[curDay].r})`)}},30000);
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>

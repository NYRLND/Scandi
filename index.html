<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Scandinavia">
<meta name="theme-color" content="#F1EDE2">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Ryan Family · Scandinavia 2026</title>
<style>
:root{
  --paper:#F1EDE2; --paper2:#EAE4D4; --ink:#14263A; --ink2:#4A5A6C; --faint:#8B93A0;
  --hair:#CFC6B0; --card:#FBF8F0;
  --travel:#5A6B8F; --fjord:#1E6E68; --capital:#9C4A2F; --cruise:#24466B; --denmark:#A63A46;
  --ok:#2E7D4F; --warn:#B5541C;
  --safe-b: env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  overscroll-behavior-y:none}
.serif{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
.mono{font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
a{color:inherit}
#app{max-width:640px;margin:0 auto;padding-bottom:calc(76px + var(--safe-b))}

/* ---------- voyage scrubber ---------- */
#voyage{position:sticky;top:0;z-index:40;background:linear-gradient(var(--paper) 82%,rgba(241,237,226,0));
  padding:10px 12px 14px}
#vTitle{display:flex;justify-content:space-between;align-items:baseline;padding:2px 4px 8px}
#vTitle .t{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-weight:600;font-size:15px;letter-spacing:.04em}
#vTitle .d{font-size:11px;color:var(--ink2);letter-spacing:.08em;text-transform:uppercase}
#track{position:relative;height:34px}
#trackLine{position:absolute;left:6px;right:6px;top:16px;border-top:2px dashed var(--hair)}
#ticks{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;padding:0 2px}
.tick{width:100%;height:34px;display:flex;align-items:center;justify-content:center;position:relative}
.tick i{display:block;width:7px;height:7px;border-radius:50%;background:var(--tc,var(--faint));opacity:.55;transition:all .15s}
.tick.cur i{width:15px;height:15px;opacity:1;box-shadow:0 0 0 3px var(--paper),0 0 0 4.5px var(--tc)}
.tick.today i::after{content:"";position:absolute;left:50%;top:-3px;transform:translateX(-50%);
  width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid var(--ink)}
/* ---------- day header ---------- */
.dayHead{margin:2px 12px 14px;padding:16px 16px 14px;background:var(--card);border:1px solid var(--hair);
  border-radius:14px;position:relative;overflow:hidden}
.dayHead::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--rc)}
.kick{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--rc);font-weight:700}
.city{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:30px;line-height:1.12;font-weight:600;margin:4px 0 2px}
.dsub{font-size:13px;color:var(--ink2)}
.lede{margin:10px 0 0;font-size:14.5px;color:var(--ink2);line-height:1.5}
.navRow{display:flex;justify-content:space-between;margin:0 12px 10px;gap:8px}
.navBtn{flex:1;padding:9px 0;border:1px solid var(--hair);border-radius:10px;background:var(--card);
  font-size:13px;font-weight:600;color:var(--ink2)}
.navBtn:active{background:var(--paper2)}
/* ---------- countdown ---------- */
.count{margin:0 12px 12px;padding:10px 14px;border-radius:12px;background:var(--ink);color:#F4EFE2;
  display:flex;justify-content:space-between;align-items:center;font-size:13.5px}
.count b{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:15px}
/* ---------- sections ---------- */
.sec{margin:0 12px 12px;padding:14px 16px;background:var(--card);border:1px solid var(--hair);border-radius:14px}
.sec h3{margin:0 0 8px;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);
  font-weight:700;display:flex;align-items:center;gap:8px}
.sec h3::after{content:"";flex:1;border-top:1px dashed var(--hair)}
.blockName{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-weight:700;font-size:16px;margin:12px 0 4px}
.blockName:first-of-type{margin-top:2px}
/* items */
.item{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--paper2);position:relative}
.item:last-child{border-bottom:none}
.chk{flex:none;width:22px;height:22px;margin-top:1px;border:1.6px solid var(--hair);border-radius:7px;
  display:flex;align-items:center;justify-content:center;color:transparent;font-size:13px;background:var(--paper)}
.item.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.item.done .it{opacity:.45;text-decoration:line-through}
.it{flex:1;min-width:0}
.it b{font-size:15px}
.it .desc{font-size:13.5px;color:var(--ink2);margin-top:1px}
.it .alt{font-size:13px;color:var(--faint);font-style:italic;margin-top:3px}
.it .time{display:inline-block;font-family:ui-monospace,"SF Mono",Menlo,monospace;font-weight:700;font-size:13px;
  color:var(--rc);margin-right:6px}
.links{margin-top:5px;display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--rc);
  border:1px solid var(--hair);border-radius:99px;padding:3px 10px;background:var(--paper);text-decoration:none}
.ref{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12.5px;background:var(--paper2);
  border-radius:6px;padding:1px 7px;letter-spacing:.03em}
.editBtn{flex:none;color:var(--faint);font-size:15px;padding:2px 4px;align-self:flex-start;display:none}
body.editing .editBtn{display:block}
body.editing .chk{display:none}
.item.hidden{display:none}
body.editing .item.hidden{display:flex;opacity:.35}
/* mini sections */
.mini{font-size:14px;line-height:1.55}
.mini + .mini{margin-top:8px}
.mini .lab{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;color:var(--rc);display:block;margin-bottom:2px}
.phraseBox{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.phraseBox .p{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:21px;font-weight:700}
.phraseBox .pr{font-size:13px;color:var(--ink2)}
.warnBox{border-left:4px solid var(--warn);background:#F7EEDF;border-radius:10px;padding:10px 12px;font-size:13.5px;margin-top:10px}
.warnBox b{color:var(--warn)}
/* notes */
textarea.note{width:100%;min-height:64px;border:1px dashed var(--hair);border-radius:10px;background:var(--paper);
  padding:10px;font:14px/1.5 -apple-system,sans-serif;color:var(--ink);resize:vertical}
/* ---------- list view ---------- */
.dayRow{display:flex;gap:12px;align-items:center;margin:0 12px 8px;padding:12px 14px;background:var(--card);
  border:1px solid var(--hair);border-radius:12px}
.dayRow .dot{flex:none;width:11px;height:11px;border-radius:50%;background:var(--rc)}
.dayRow .m{flex:1;min-width:0}
.dayRow .m b{font-size:15px}
.dayRow .m span{display:block;font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dayRow .dn{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11.5px;color:var(--faint)}
.dayRow.today{outline:2px solid var(--ink);outline-offset:-1px}
/* ---------- vault ---------- */
.vGroup{margin:0 12px 12px;background:var(--card);border:1px solid var(--hair);border-radius:14px;overflow:hidden}
.vGroup h4{margin:0;padding:11px 16px;font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink2);
  border-bottom:1px dashed var(--hair);background:var(--paper2)}
.vRow{padding:10px 16px;border-bottom:1px dashed var(--paper2);font-size:14px}
.vRow:last-child{border-bottom:none}
.vRow .vt{font-weight:600}
.vRow .vs{font-size:12.5px;color:var(--ink2);margin:1px 0 4px}
.copyRef{margin-left:6px;font-size:11px;color:var(--rc);font-weight:700}
/* ---------- more ---------- */
.tool{margin:0 12px 12px;padding:14px 16px;background:var(--card);border:1px solid var(--hair);border-radius:14px}
.tool h4{margin:0 0 8px;font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink2)}
.convRow{display:flex;gap:8px;align-items:center;margin-top:6px}
.convRow input{width:0;flex:1;border:1px solid var(--hair);border-radius:10px;padding:9px 10px;font:15px -apple-system,sans-serif;background:var(--paper)}
.convRow select{border:1px solid var(--hair);border-radius:10px;padding:9px 6px;background:var(--paper);font:14px -apple-system,sans-serif}
.convOut{margin-top:8px;font-size:15px;font-weight:700}
.btn{display:inline-block;border:1px solid var(--hair);border-radius:10px;background:var(--paper);padding:9px 14px;
  font-size:13.5px;font-weight:600;color:var(--ink);margin:4px 6px 0 0}
.btn.primary{background:var(--ink);color:#F4EFE2;border-color:var(--ink)}
.small{font-size:12.5px;color:var(--ink2)}
/* ---------- tabbar ---------- */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(251,248,240,.96);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-top:1px solid var(--hair);
  display:flex;max-width:640px;margin:0 auto;padding-bottom:var(--safe-b)}
#tabs button{flex:1;padding:10px 0 8px;font-size:11px;font-weight:600;color:var(--faint);
  display:flex;flex-direction:column;align-items:center;gap:3px;letter-spacing:.02em}
#tabs button .ic{font-size:19px;line-height:1}
#tabs button.on{color:var(--ink)}
.offlineBadge{position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);right:10px;z-index:60;font-size:10px;
  font-weight:700;letter-spacing:.08em;background:var(--ink);color:#F4EFE2;border-radius:99px;padding:3px 9px;display:none}
body.offline .offlineBadge{display:block}
.footer{margin:18px 12px 8px;text-align:center;font-size:11px;color:var(--faint);letter-spacing:.1em;text-transform:uppercase}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>

   {b:"Kreklingen → Orrabenken hike",d:"Trailhead ~15 min from the quay by the school sports hall. ~1 hr up through birch forest to the 370m viewpoint — picnic tables, panorama over village and fjord. Round trip 1.5–2 hrs. Turn around at the bench; skip Buråsi (575m) unless everyone's strong and it's clear.",q:"Kreklingen, Balestrand",a:"Rain pivot: Norsk Reiselivsmuseum (Holmen 12) — built into bedrock, ~1.5 hr, café with fjord views."}]},
  {n:"Midday",items:[{b:"Packed lunch from Joker groceries",d:"On the trail or back at the apartment."}]},
  {n:"Afternoon",items:[
   {b:"Heit Sauna Balestrand — optional",d:"Fjord-edge floating sauna with cold-plunge stairs into the Sognefjord (Kong Beles veg 30). Private 1.5-hr slot, book at heitbalestrand.com; bring 2 towels each + swimwear.",q:"Heit Sauna, Balestrand",u:"https://heitbalestrand.com",a:"Honest note: the most skippable of the trip's four sauna options — a free waterfront plunge gives the boys most of the memory. But if you want ONE floating-sauna-on-a-fjord moment, this is the prettiest setting."}]},
  {n:"Evening",items:[
   {b:"Balholm Bar og Bistro",d:"In Balestrand Hotel, fjord-view bar food, walk-in, daily 1–9 PM. Fjord sandwich, fish soup, or burger; coconut cake if it's on.",q:"Balestrand Hotel, Balestrand",a:"Or Gekkens — family-owned, fresh salmon, pepper steak, local beers and ciders. Balholm cider on the balcony either way."}]}],
 phrase:{p:"Det smaker godt",pr:"deh SMAH-ker got",e:"It tastes good — deploy on any host or cook and watch them light up."},
 boys:"Wild berries, small waterfalls and wildlife the whole way up — plus the fjord plunge if the sauna happens.",
 conn:"Dead zones above the village on the trail — don't count on a live signal mid-hike. Offline map has you covered.",
 customs:"Norway's allemannsretten — the right to roam. You can walk, picnic and swim on almost any uncultivated land. The trail crossing farm fences is normal and legal; close every gate behind you.",
 book:[]},

{d:"2026-07-13",dow:"Mon",city:"Balestrand",sub:"Fishing with Captain Tor · cook your catch",r:"fjord",
 lede:"The marquee Balestrand day: out on the Esefjord with Captain Tor around midday, then the whole point of the exercise — pan-frying your own catch for dinner.",
 blocks:[
  {n:"Morning",items:[{b:"Easy morning",d:"Coffee, balcony, fjord. Keep it light ahead of the boat; pack a picnic from groceries."}]},
  {n:"Midday — Fishing trip [CONFIRMED]",items:[
   {b:"Captain Tor · Balestrand Fjord Angling",d:"Private boat, your group only. Target the 12:00 slot; arrive 15 min early at the Balestrand Adventure House / Tourist Info. Card payment day-of.",q:"Balestrand Adventure, Balestrand"},
   {b:"Pick the tier on the day",d:"Classic (3500 NOK, 1.5 hrs): dragon-villa sightseeing + rod fishing for sand whiting — the sensible pick. Legacy (5000 NOK, 3 hrs): adds trolling and the pre-set net haul — pulling up a mystery net is the kid-magnet."},
   {b:"Inge Menes bare-boat — held as backup",d:"~$125, Tjugum, +47 950 41 651. Still an ACTIVE reservation, not a placeholder — it bills if not used or cancelled. Use it for extra water time, or cancel once Tor's trip is done."}]},
  {n:"Afternoon",items:[{b:"Clean the fish at the dock",d:"Then back to the apartment."}]},
  {n:"Evening",items:[
   {b:"Cook your own catch — stekt fisk",d:"Classic Norwegian pan-fried fish: salt, butter, lemon, dill — with boiled new potatoes and peas. Light candles, the whole bit. One of the best dinners of the trip, and the boat day exists to make it happen."}]}],
 phrase:{p:"Tusen takk",pr:"TOO-sen tahk",e:"A thousand thanks — for Captain Tor, after the catch."},
 boys:"Catching dinner with their own hands — and if the Legacy tier wins, hauling a net with no idea what's inside: crab, starfish, sea urchin, odd fish.",
 conn:"Expect dead zones out on the water — tell anyone expecting texts that you'll surface by late afternoon.",
 book:[{l:"Captain Tor 12:00 slot",r:"confirmed by email"},{l:"Inge Menes backup boat",r:"+47 950 41 651"}]},

{d:"2026-07-14",dow:"Tue",city:"Balestrand → Lofthus",sub:"Ferry · Flåmsbana · rail · bus — the big chain",r:"fjord",
 lede:"Four vehicles, one spectacular day: express ferry down the Aurlandsfjord, one of the world's steepest railways up to Myrdal, rail to Voss, bus over to the Hardangerfjord. Every leg is booked; the buffers are built in.",
 transit:[
  {t:"11:58",l:"Norled ferry Balestrand → Flåm",ref:"#2542170371"},
  {t:"14:45",l:"Flåmsbana Flåm → Myrdal",ref:"OGD-QDL-A3T"},
  {t:"15:56",l:"R40 Myrdal → Voss, arr 16:51",ref:"SUA-CW4-YVS"},
  {t:"18:01",l:"Skyss Bus 990 Voss Tinghus → Lofthus kai, arr 19:20 · pay in Skyss app",ref:"~$21–24/pp"}],
 blocks:[
  {n:"Morning",items:[
   {b:"Breakfast at Fløyfisken",d:"Holmen 2, fjord view. Norwegian waffles or smoked salmon; soft serve for the boys if it's earned.",q:"Fløyfisken, Balestrand"},
   {b:"St. Olaf's Church — 10 minutes",d:"Free, 5-min walk. The striking 1897 neo-stave church said to have inspired the Frozen coronation chapel. Worth the glance on the way out.",q:"St Olaf's Church, Balestrand"},
   {b:"Pack a travel lunch",d:"From Joker leftovers — it's a long chain with thin food options."}]},
  {n:"Evening — arrive Lofthus",items:[
   {b:"Check in — Hotel Ullensvang",d:"Family Junior Suite. Lofthus kai is ~5 min from the hotel.",q:"Hotel Ullensvang, Lofthus"},
   {b:"Grieg's composer cabin on the grounds",d:"'Komposten' — free, in the garden, where Edvard Grieg composed during summer stays."},
   {b:"Easy dinner",d:"Bunnpris (Sjoarvegen 18, open to 8 PM Tue) for a light supermarket dinner, or Lofthus Ekspedisjon on the fjord (open to 22:00) if energy holds.",q:"Lofthus Ekspedisjon, Lofthus"}]}],
 warn:"If the R40 runs late and you miss the 18:01 bus, the next 990 isn't until ~22:16 — have the Ullensvang front desk's taxi contact ready (~NOK 1,000–1,300 from Voss). The hotel was pre-flagged about a possible late transfer.",
 phrase:{p:"Fjord og fjell",pr:"fyoor oh FYELL",e:"Fjord and mountain — today's entire itinerary in three words."},
 boys:"The Flåmsbana drops through 20 tunnels on one of the steepest standard railways anywhere — watch for the waterfall stop on the way up.",
 conn:"The rail chain runs through long tunnels and remote valleys — offline maps for Flåm + Hardanger should already be downloaded. Don't burn battery hunting for signal.",
 book:[{l:"Hotel Ullensvang",r:"Family Junior Suite"}]},

{d:"2026-07-15",dow:"Wed",city:"Lofthus",sub:"Ullensvang Bath · Elvadalen waterfalls",r:"fjord",
 lede:"Hardanger settles in: a morning in the hotel's 88-meter swim channel, an easy river-valley hike to two waterfalls, and an early burger dinner — KOMPAEN closes at six sharp.",
 blocks:[
  {n:"Morning",items:[
   {b:"Slow hotel breakfast, then the Ullensvang Bath",d:"88m swimming channel, multiple saunas — included for guests. Pack a picnic from Bunnpris before heading out.",q:"Hotel Ullensvang, Lofthus"}]},
  {n:"Late morning",items:[
   {b:"Elvadalen (River Valley) hike",d:"3.5-mi loop, 1.5–2 hrs, ~120m gain, along the Opo river through orchards to the Bjødnabykset and Skrikjo waterfalls. First kilometer is steep, then it evens out.",q:"Elvadalen, Lofthus",a:"Look for the rock with ancient drilled pagan holes on the left — the info board explains it."}]},
  {n:"Afternoon",items:[{b:"Pool, fjord beach, lawn time",d:"Optional cold plunge in the Hardangerfjord after the hike."}]},
  {n:"Evening",items:[
   {b:"Early dinner at KOMPAEN Bistro og Deli",d:"Ullensvangveien 887, 3-min walk. Family-owned, open Wed–Sun until 6 PM ONLY — target ~5 PM seating. The Angus burger is the raved-about pick; fish & chips solid.",q:"KOMPAEN Bistro og Deli, Lofthus",a:"If the hike runs long past KOMPAEN's hard close: Lofthus Ekspedisjon (open to 22:00) — interchangeable with tomorrow's dinner."}]}],
 warn:"Tonight or tomorrow morning: ask the front desk about a packed breakfast box for Friday's 6:30 AM departure — confirm what time it can be ready.",
 phrase:{p:"Eple",pr:"EH-pleh",e:"Apple — you're standing in Norway's orchard. 500,000+ fruit trees around you."},
 boys:"Waterfall spray at Skrikjo, the mystery pagan holes, and an 88-meter pool channel back at the hotel.",
 snacks:"At Bunnpris: skolebrød (custard bun with coconut), a tube of Norwegian kaviar for knekkebrød, and another Solo for the trail.",
 conn:"Farm trails and higher ground are patchy; the village and hotel are fine.",
 book:[]},

{d:"2026-07-16",dow:"Thu",city:"Lofthus",sub:"Fruit Trail · cider farms · pre-dawn prep",r:"fjord",
 lede:"The Hardanger Fruit Trail at a stroll — drop-in cider farms, juice tastings for the boys, orchard picnic — then buttoned-up prep for tomorrow's high-stakes 6:55 bus.",
 blocks:[
  {n:"Late morning",items:[
   {b:"Hardanger Fruktstien (Fruit Trail)",d:"Paved paths through the orchards around the hotel — fruit growing here started 800 years ago at Opedal farm. 2–3 hrs at a leisurely pace with stops.",q:"Lofthus, Ullensvang"},
   {b:"Alvavoll Frukt & Sidergard",d:"Opedalsvegen 39 — drop-in cider flight and snacks, Mon–Sat in summer.",q:"Alvavoll frukt og sidergard, Lofthus"},
   {b:"Lofthus Sideri",d:"Lofthusvegen 49, Mon–Sat 10–18. Drop-in tastings, juice tastings for the kids, ~170 NOK/bottle.",q:"Lofthus Sideri, Lofthus",a:"Optional adds: Opedalstunet walk-in shop on the trail; Helleland Gard is intimate but remote — skip if it's a stretch."}]},
  {n:"Afternoon",items:[{b:"Orchard picnic, then pool / fjord beach",d:"Picnic on the trail — orchard grass, fjord views."}]},
  {n:"Late afternoon — DEPARTURE PREP",items:[
   {b:"Pack tonight",d:"Everything but toothbrushes. 6:30 AM wake tomorrow."},
   {b:"Confirm the breakfast box",d:"With the front desk, if not already done."},
   {b:"Arrange the standby taxi",d:"Soft hold for 6:40 AM via the concierge in case Bus 990 has issues — no charge unless used."}]},
  {n:"Evening",items:[
   {b:"Dinner at Lofthus Ekspedisjon",d:"Sjoarvegen 27, on the fjord with their own dock, open to 22:00. Wood-fired pizza and a flight of house Hardanger ciders.",q:"Lofthus Ekspedisjon, Lofthus"}]}],
 warn:"Tomorrow is the trip's highest-stakes morning: 6:30 wake, 6:40 walk to the kai, 6:55 bus. Alarms on two phones.",
 phrase:{p:"Skål!",pr:"skawl",e:"Cheers! — with cider, in the region that invented Norwegian cider."},
 boys:"Juice tastings poured like wine flights, and permission to eat a picnic in someone's orchard (that's the right-to-roam again).",
 eyes:["Fruit trees planted in rows dating back generations — some farms here are on their 20th generation of the same family.","The Folgefonna glacier across the fjord, hanging white above the orchards."],
 book:[]},

{d:"2026-07-17",dow:"Fri",city:"Lofthus → Oslo",sub:"HIGH STAKES · pre-dawn bus + Bergen Railway",r:"capital",
 lede:"The one morning with zero slack: 6:55 bus to Voss, then five hours on the Bergen Railway across the roof of Norway into Oslo. After that, the trip downshifts into city mode.",
 transit:[
  {t:"06:55",l:"Skyss Bus 990 Lofthus kai → Voss, arr ~8:25 · wake 6:30, walk 6:40",ref:"Skyss app"},
  {t:"09:20",l:"Vy F4 Voss → Oslo S, arr 15:09 · Carriage 7, seats 17/18/21/22",ref:"6P3-IOE-EID"}],
 blocks:[
  {n:"Afternoon — arrive Oslo",items:[
   {b:"Uber from Oslo S to Majorstuen",d:"Airbnb host Margareth Aurora · Pilestredet 53C.",q:"Pilestredet 53C, Oslo",ref:"HMAWRADHED"}]},
  {n:"Evening",items:[
   {b:"Cafe Laundromat",d:"Underhaugsveien 2, ~6 min walk — café-meets-laundromat, cheeseburgers, books, beers, open to midnight.",q:"Cafe Laundromat, Underhaugsveien 2, Oslo",a:"Or Digg Pizza Majorstuen (Bogstadveien 62) — build-your-own, iPad ordering, very kid-friendly."}]}],
 warn:"Backup if the bus fails: the standby taxi arranged yesterday via Ullensvang (~NOK 3,000–4,000, ~90 min to Voss). Missed train: rebook at vy.no.",
 phrase:{p:"Unnskyld",pr:"OON-shill",e:"Excuse me — the essential city word, starting today."},
 boys:"The Bergen Railway is one of Europe's great train rides — snowfields in July possible near the top. Breakfast box on laps, five hours of scenery.",
 conn:"Long tunnels most of the morning. By Oslo you're back to full-strength city coverage for the rest of Norway.",
 book:[{l:"Vy train",r:"6P3-IOE-EID"},{l:"Oslo Airbnb · Margareth Aurora",r:"HMAWRADHED"}]},

{d:"2026-07-18",dow:"Sat",city:"Oslo",sub:"Vigeland · Grünerløkka · reptiles",r:"capital",
 lede:"Oslo's two personalities in one day: 200 bronze humans in a monumental park, then the indie-coffee-and-street-art side of the river — with a reptile park wedged in for the boys.",
 blocks:[
  {n:"Morning",items:[
   {b:"Vigeland Park",d:"~10 min walk west, free, open 24/7. 1.5–2 hrs among 200+ Gustav Vigeland sculptures: the Monolith, the Bridge, and Sinnataggen — the famous furious toddler.",q:"Vigeland Park, Oslo",a:"Rain pivot: VIKINGR at the Historical Museum (NOK 160/adult, under-18 free) — the Viking Ship Museum is closed until 2027; this is the substitute."}]},
  {n:"Midday",items:[
   {b:"T-bane to Grünerløkka, lunch at Mathallen",d:"Helt Vilt inside the food hall — wild game burgers. The moose burger or the Arctic Journey tasting platter.",q:"Mathallen Oslo"}]},
  {n:"Afternoon",items:[
   {b:"Grünerløkka wander",d:"Akerselva river path, street art, vintage shops.",q:"Grünerløkka, Oslo"},
   {b:"Tim Wendelboe",d:"Grüners gate 1 — world-renowned Nordic roaster, standing-only. Hot chocolate for the boys.",q:"Tim Wendelboe, Oslo"},
   {b:"Oslo Reptile Park",d:"St. Olavs gate 2, ~1 hr, no booking, rain-proof. Boas, poison dart frogs, tarantulas, a black widow, feeding times. High 'whoa' factor.",q:"Oslo Reptilpark",a:"Optional: Outland Oslo (Grensen 5–7) is ~15 min south — card-shop break on the way back."}]},
  {n:"Evening",items:[
   {b:"Tram back to Majorstuen, casual dinner",d:"Cafe Laundromat or Digg Pizza if not used Friday, or self-cater."}]}],
 phrase:{p:"Hvor er…?",pr:"voor AIR",e:"Where is…? — pair it with 'toalettet' and the boys are self-sufficient."},
 boys:"A black widow, feeding time, and Sinnataggen — the angriest toddler in art history. Photo op stomping alongside him.",
 eyes:["Vigeland designed everything in the park down to the lamp posts and gates.","Grünerløkka's street art changes constantly — the boys can hunt for the best piece.","The Akerselva river powered Oslo's whole industrial revolution; the old mills are now studios."],
 customs:"Janteloven — the unwritten Nordic law of modesty. Nobody brags, nobody flexes. It's why service can feel reserved: it's respect, not rudeness.",
 book:[]},

{d:"2026-07-19",dow:"Sun",city:"Oslo",sub:"Karl Johans spine · Akershus Fortress",r:"capital",
 lede:"The classic city spine on a quiet Sunday: palace park, the main street's ice-cream drift, a moose-sausage lunch, and an unhurried afternoon running the ramparts of a 13th-century fortress.",
 blocks:[
  {n:"Morning",items:[
   {b:"Tram 19 to Slottsparken",d:"Royal Palace grounds, free public park. Glance at the guards on post — Jul 19 is NOT a parade day; the 13:30 handover is a 15-min static swap, not worth planning around.",q:"Slottsparken, Oslo"}]},
  {n:"Midday",items:[
   {b:"Walk down Karl Johans gate",d:"Palace → Stortinget. Shops, street performers, ice cream.",q:"Karl Johans gate, Oslo"},
   {b:"Lunch: Sausage Factory & Wild Factory truck",d:"Rådhusplassen — Norwegian game sausages; the moose sausage with cranberry, caramelized onion and mustard is the signature. Confirm the truck's there day-of (it travels to festivals).",q:"Rådhusplassen, Oslo",a:"Fallback: Oslo Street Food (Torggata 16b, Sun 12–21) — indoor hall, 8 min northeast."}]},
  {n:"Afternoon",items:[
   {b:"Akershus Fortress — the centerpiece",d:"Free grounds, open to 9 PM. Dramatic 13th-century clifftop fortress; the boys run the cobblestone ramparts, harbor views the whole way.",q:"Akershus Fortress, Oslo",a:"Flex hour: Aker Brygge harbor wander, or the Reptile Park if it didn't happen Saturday."}]},
  {n:"Evening",items:[
   {b:"Dinner near the Airbnb + pack",d:"Tomorrow is a moving day — bags mostly closed tonight makes the morning easy."}]}],
 phrase:{p:"Regningen, takk",pr:"RYE-ning-en tahk",e:"The bill, please — though in Norway you usually pay at the counter."},
 boys:"Rampart-running at Akershus, and the completion of the game-meat quest: reindeer dog (Bergen) → moose burger (yesterday) → moose sausage (today).",
 eyes:["Stortinget's lions out front are carved from prison labor's granite — by a convicted counterfeiter.","From the fortress walls, look across to the Opera House roof — you'll be standing on it tomorrow."],
 customs:"No jaywalking, even on an empty street at midnight — Norwegians wait for the green man, and the boys should too.",
 book:[]},

{d:"2026-07-20",dow:"Mon",city:"Oslo → Drøbak",sub:"Opera roof send-off · bus down the fjord",r:"capital",
 lede:"A last Oslo flourish — walking up a building designed to be walked on — then the easy bus down the Oslofjord to a wooden town of galleries and one very famous Santa shop.",
 transit:[{t:"~15:00",l:"Bus 500 Oslo Bussterminal → Drøbak Brygge, ~50 min · every 30 min, Ruter app",ref:"no booking"}],
 blocks:[
  {n:"Late morning",items:[
   {b:"Checkout by 12, bags to Oslo S",d:"T-bane Line 1 or 2 from Majorstuen (~10 min). Drop bags at Bounce/Radical Storage near Oslo S (~$13–17 total via app)."},
   {b:"Oslo Opera House roof walk",d:"10-min walk across the pedestrian bridge. Free, open 24/7 — the sloping marble roof was designed to be climbed. Fjord, MUNCH museum and Barcode skyline views. 30–45 min.",q:"Oslo Opera House",a:"If everyone's tired: skip the climb, walk the Bjørvika waterfront instead — same send-off, no slope."}]},
  {n:"Midday",items:[
   {b:"Lunch at Østbanehallen",d:"Food hall inside Oslo S — fast, multiple stalls, zero detour. Then collect bags.",q:"Østbanehallen, Oslo"}]},
  {n:"Late afternoon — Drøbak",items:[
   {b:"Grocery stop en route to the Airbnb",d:"Coop, Rema 1000 or Bunnpris — all central. Tonight's dinner + tomorrow's picnic supplies."},
   {b:"Check in 4 PM — Torget 7",d:"Host Åse, on the town square, ~5 min walk from the bus.",q:"Torget 7, Drøbak",ref:"HMJQSM2XHS"}]},
  {n:"Evening",items:[
   {b:"Self-cater dinner + harbor walk",d:"Cheese, charcuterie, local fish cakes, cider. The walk passes Tregaardens Julehus (the year-round Christmas house), the Father Christmas sign, and Drøbak Church (1776).",q:"Tregaardens Julehus, Drøbak"}]}],
 phrase:{p:"Båt",pr:"bawt",e:"Boat — Drøbak's whole reason for existing."},
 boys:"Running up the Opera House roof — a building you're supposed to climb — then Norway's Christmas headquarters in July.",
 eyes:["Note: the B22 ferry to Drøbak runs weekends only — that's why today is a bus day.","Drøbak was Oslo's winter harbor when the inner fjord froze — the wooden town is largely intact 1700s–1800s."],
 snacks:"At the Drøbak grocery: fresh fiskekaker (fish cakes — pan-fry for dinner), a local Oslofjord-brewery beer, and Smash! (chocolate-covered corn snacks) for the boys.",
 book:[{l:"Drøbak Airbnb · Åse",r:"HMJQSM2XHS"}]},

{d:"2026-07-21",dow:"Tue",city:"Drøbak",sub:"Hugo the wolffish · coast path · fjord sauna",r:"capital",
 lede:"Small-town day, big-memory pieces: a charmingly dated aquarium with a celebrity wolffish, a pine-woods coastal walk to a swimming beach, and a booked fjord-edge sauna staring across at Oscarsborg.",
 blocks:[
  {n:"Late morning",items:[
   {b:"Drøbak Akvarium",d:"Under the Tourist Info at the harbor, ~NOK 40–160. Touch pool, sharks, and Hugo the wolffish — the local celebrity. ~1 hr.",q:"Drøbak Akvarium",a:"Honest expectation: small, dated, charming — recent reviews flag some tank wear. Worth an hour for the touch pool and Hugo; don't expect Bergen polish."}]},
  {n:"Afternoon",items:[
   {b:"Picnic supplies: Håndverksbakeriet",d:"Torggata 6, 3 min away, 8–5 daily. Sandwiches, pizza slices, skolebrød, cinnamon rolls. Anna at the counter gets name-checked in reviews.",q:"Håndverksbakeriet, Drøbak"},
   {b:"Kyststien to Skiphellestranda",d:"~25 min south along the coast path, then pine woods. Swim, rock-sit, picnic. ~2.5–3 mi total, very easy.",q:"Skiphellestranda, Drøbak",a:"Backup: Badeparken + Parrstranda harbor loop — sandy beach, swim ladders, diving towers, playground. Gentler, in town."}]},
  {n:"Late afternoon — SAUNA [book in advance]",items:[
   {b:"Drøbak Badstue",d:"Lehmannsbrygga, ~10 min walk. Fjord-edge sauna with a direct view of Oscarsborg, cold-plunge steps into the Oslofjord. Private for 4: NOK 1,700 / 1.5 hrs weekdays (shared: NOK 250/pp). Open 7 AM–10 PM.",q:"Drøbak Badstue",u:"https://drobakbadstue.no",a:"Skip guilt-free if the walk ran long — pivot to the Airbnb."}]},
  {n:"Evening",items:[
   {b:"Dinner flex (one night out of two)",d:"Default self-cater tonight; if eating out, dgb – Mat & Vinstue is the pick — see tomorrow's Dinner Pool for the full rundown."}]}],
 phrase:{p:"Havet",pr:"HAH-veh",e:"The sea — what everything in Drøbak faces."},
 boys:"Hugo the wolffish (all teeth, weirdly lovable), a beach swim, and a sauna that ends with jumping into a fjord.",
 customs:"Sauna etiquette: shower first, sit on a towel, and the cold plunge is optional-but-honorable. Quiet talk inside — it's a place to be calm, not loud.",
 book:[{l:"Drøbak Badstue private slot",r:"drobakbadstue.no"}]},

{d:"2026-07-22",dow:"Wed",city:"Drøbak",sub:"Oscarsborg — the fortress that sank a warship",r:"capital",
 lede:"The full day on the island: the guns that sank the Blücher on the first morning of Norway's WWII, tunnels to explore, rocks to swim off — then the town's best-fit dinner back on the square.",
 blocks:[
  {n:"Late morning",items:[
   {b:"Ferry to Oscarsborg from Sundbrygga",d:"Main jetty, 5 min from the Airbnb; 5-min crossing. Buy the round-trip QR ticket BEFORE boarding (valid 7 days, not sold onboard), ~NOK 80–100/adult.",q:"Sundbrygga, Drøbak",a:"⚠ Verify the day's departures at the dock on arrival — some sailings require phone pre-booking (+47 900 99 414). Don't get stranded."}]},
  {n:"On the island",items:[
   {b:"Oscarsborg Fortress — free",d:"The 28cm Krupp cannons in their emplacements, the Blücher-sinking museum with the April 9, 1940 video, tunnels, and the island loop walk. 2–3 hrs.",q:"Oscarsborg Fortress"},
   {b:"Island picnic + swim off the rocks",d:"From this morning's groceries and bakery haul. The boys will want the swim if the weather allows."}]},
  {n:"Mid-afternoon",items:[
   {b:"Cake stop: Galleri Cafe Teskje",d:"Niels Carlsens gate 7, Wed 11:30–5. Homemade cakes in an art gallery — strawberries-and-cream is the standout.",q:"Galleri Cafe Teskje, Drøbak",a:"Skip if the island picnic ran heavy."}]},
  {n:"Evening — Drøbak Dinner Pool (pick tonight or self-cater)",items:[
   {b:"dgb – Mat & Vinstue [RECOMMENDED]",d:"Havnebakken 1, on Torget, in an 18th-century bakery. Real kids' menu. The creamy fish soup (349 kr) is the specialty — get one for the table; kids' cheeseburger 175 kr; adults DGB burger or scampi pasta. ~1,200–1,400 kr for four.",q:"dgb Mat og Vinstue, Drøbak"},
   {b:"Kumlegaarden — optional splurge",d:"30 sec away, traditional Norwegian in Drøbak's oldest buildings, fish soup the standout. Mains 398–498 kr (~$170–230 for four) — hold only if you want ONE formal Norwegian dinner this trip. Wednesday works.",q:"Kumlegaarden, Drøbak",a:"Third option: Handelshuset Gastrobar on Torget — candle-lit pizza, daily to 11 PM, ~$60–80 family."}]}],
 warn:"Tomorrow is cruise day — the near-unrecoverable deadline. Tonight: confirm bags are packable by ~11 AM and set the bakery-run plan.",
 phrase:{p:"Festning",pr:"FEST-ning",e:"Fortress — today's word, today's island."},
 boys:"Standing next to the actual cannons that sank a heavy cruiser at point-blank range on April 9, 1940 — then swimming where it happened.",
 eyes:["The torpedo battery hidden inside the island did the fatal damage — the cannons get the fame.","Blücher still lies on the fjord floor ~90m down, a few hundred meters from where you'll picnic."],
 book:[]},

{d:"2026-07-23",dow:"Thu",city:"Drøbak → Cruise",sub:"Bus to Oslo · board M/S Nordic Pearl",r:"cruise",
 lede:"The one hard deadline of the back half: on the ship by 3:30. Everything today is sequenced backward from that — bakery, bus with buffer, optional food-hall lunch that gets dropped without hesitation if time runs tight.",
 transit:[
  {t:"≤12:30",l:"Bus 500 Drøbak Brygge → Oslo Bussterminal, ~50 min · Ruter app · leave NO later than 12:30",ref:"no booking"},
  {t:"15:30",l:"Board M/S Nordic Pearl at Vippetangen · departs 16:30",ref:"#119987 · DcTtM2QqkP"}],

/* ============ APP ============ */
const $=s=>document.querySelector(s);
const store={
 get k(){return "ryanTrip2026"},
 load(){try{return JSON.parse(localStorage.getItem(this.k))||{}}catch(e){return{}}},
 save(s){try{localStorage.setItem(this.k,JSON.stringify(s))}catch(e){}}
};
let S=store.load(); S.done=S.done||{}; S.notes=S.notes||{}; S.edits=S.edits||{}; S.hidden=S.hidden||{}; S.custom=S.custom||{}; S.prep=S.prep||{}; S.rate=S.rate||{nok:10.0,dkk:6.9};
let curDay=0, curTab="day", editing=false;
const esc=t=>(t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const maps=q=>"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q);
const fmtDate=d=>{const dt=new Date(d+"T12:00:00");return dt.toLocaleDateString("en-US",{month:"short",day:"numeric"})};
function todayIdx(){const now=new Date();for(let i=0;i<DATA.length;i++){const d=new Date(DATA[i].d+"T23:59:59");if(now<=d)return i}return DATA.length-1}
function itemKey(di,bi,ii){return di+"."+bi+"."+ii}
function itemState(di,bi,ii,f,v){const k=itemKey(di,bi,ii);if(v===undefined)return S[f][k];S[f][k]=v;store.save(S)}

function nextTransit(){
 const now=new Date();
 for(let i=0;i<DATA.length;i++){const day=DATA[i];if(!day.transit)continue;
  for(const t of day.transit){const m=t.t.match(/(\d{1,2}):(\d{2})/);if(!m)continue;
   const dt=new Date(day.d+"T"+m[1].padStart(2,"0")+":"+m[2]+":00");
   if(dt>now)return{dt,l:t.l,d:day.d}}}
 return null}
function countdownHTML(){
 const n=nextTransit();if(!n)return"";
 const ms=n.dt-new Date();if(ms>1000*60*60*36||ms<0)return"";
 const h=Math.floor(ms/3600000),m=Math.floor(ms%3600000/60000);
 return `<div class="count"><span>Next departure · ${esc(n.l.split("·")[0].trim())}</span><b>${h}h ${String(m).padStart(2,"0")}m</b></div>`}

function renderVoyage(){
 const T=$("#ticks");T.innerHTML="";const ti=todayIdx();
 DATA.forEach((day,i)=>{const t=document.createElement("button");t.className="tick"+(i===curDay?" cur":"")+(i===ti?" today":"");
  t.style.setProperty("--tc",`var(--${day.r})`);t.innerHTML="<i></i>";t.setAttribute("aria-label",day.city+" "+fmtDate(day.d));
  t.onclick=()=>{curDay=i;curTab="day";render()};T.appendChild(t)});
 $("#vDate").textContent=fmtDate(DATA[curDay].d)+" · Day "+(curDay+1)+" of 21"}

function itemHTML(di,bi,it,ii,isCustom){
 const k=itemKey(di,bi,ii),done=!!S.done[k],hid=!!S.hidden[k];
 const ed=S.edits[k]||{};const b=ed.b??it.b,d=ed.d??it.d;
 let links="";
 if(it.q)links+=`<a class="pill" target="_blank" rel="noopener" href="${maps(it.q)}">⌖ Map</a>`;
 if(it.u)links+=`<a class="pill" target="_blank" rel="noopener" href="${esc(it.u)}">↗ Site</a>`;
 return `<div class="item ${done?"done":""} ${hid?"hidden":""}" data-k="${k}">
  <button class="chk" onclick="toggleDone('${k}')">✓</button>
  <div class="it"><b>${esc(b)}</b>
   ${d?`<div class="desc">${esc(d)}${it.ref?` <span class="ref">${esc(it.ref)}</span>`:""}</div>`:""}
   ${it.a?`<div class="alt">${esc(it.a)}</div>`:""}
   ${links?`<div class="links">${links}</div>`:""}
  </div>
  <button class="editBtn" onclick="editItem('${k}','${di}','${bi}','${ii}',${!!isCustom})">✎</button></div>`}

function renderDay(){
 const day=DATA[curDay],rc=`var(--${day.r})`;let h="";
 h+=countdownHTML();
 h+=`<div class="navRow"><button class="navBtn" onclick="stepDay(-1)" ${curDay===0?"disabled style='opacity:.35'":""}>← ${curDay>0?esc(DATA[curDay-1].city.split("→").pop().trim()):""}</button>
     <button class="navBtn" onclick="goToday()">Today</button>
     <button class="navBtn" onclick="stepDay(1)" ${curDay===DATA.length-1?"disabled style='opacity:.35'":""}>${curDay<DATA.length-1?esc(DATA[curDay+1].city.split("→").pop().trim()):""} →</button></div>`;
 h+=`<div class="dayHead" style="--rc:${rc}"><div class="kick">${esc(day.dow)} · ${fmtDate(day.d)} · Day ${curDay+1} of 21</div>
     <div class="city serif">${esc(day.city)}</div><div class="dsub">${esc(day.sub)}</div>
     <p class="lede">${esc(day.lede)}</p></div>`;
 if(day.transit&&day.transit.length){
  h+=`<div class="sec" style="--rc:${rc}"><h3>Locked transit</h3>`;
  day.transit.forEach(t=>{h+=`<div class="item"><div class="it"><span class="time">${esc(t.t)}</span><b>${esc(t.l)}</b>
    ${t.ref?`<div class="desc"><span class="ref">${esc(t.ref)}</span></div>`:""}</div></div>`});
  h+=`</div>`}
 h+=`<div class="sec" style="--rc:${rc}"><h3>The day</h3>`;
 (day.blocks||[]).forEach((blk,bi)=>{h+=`<div class="blockName serif">${esc(blk.n)}</div>`;
  blk.items.forEach((it,ii)=>h+=itemHTML(curDay,bi,it,ii,false));
  const cust=(S.custom[curDay+"."+bi]||[]);
  cust.forEach((it,ci)=>h+=itemHTML(curDay,bi,it,"c"+ci,true));
  h+=`<div style="display:${editing?"block":"none"}"><button class="btn" onclick="addItem(${curDay},${bi})">＋ Add to ${esc(blk.n.split("—")[0].trim())}</button></div>`});
 if(day.warn)h+=`<div class="warnBox"><b>Heads up:</b> ${esc(day.warn)}</div>`;
 h+=`</div>`;
 h+=`<div class="sec" style="--rc:${rc}"><h3>Field notes</h3>`;
 h+=`<div class="mini phrase"><span class="lab">Phrase for the day</span><div class="phraseBox"><span class="p serif">${esc(day.phrase.p)}</span><span class="pr">${esc(day.phrase.pr)}</span></div><div class="desc" style="font-size:13.5px;color:var(--ink2)">${esc(day.phrase.e)}</div></div>`;
 if(day.boys)h+=`<div class="mini"><span class="lab">For the boys</span>${esc(day.boys)}</div>`;
 if(day.eyes)h+=`<div class="mini"><span class="lab">Keep an eye out</span>${day.eyes.map(e=>"· "+esc(e)).join("<br>")}</div>`;
 if(day.snacks)h+=`<div class="mini"><span class="lab">Snacks & groceries</span>${esc(day.snacks)}</div>`;
 if(day.customs)h+=`<div class="mini"><span class="lab">Local custom</span>${esc(day.customs)}</div>`;
 if(day.conn)h+=`<div class="mini"><span class="lab">Connectivity</span>${esc(day.conn)}</div>`;
 h+=`</div>`;
 if(day.book&&day.book.length){h+=`<div class="sec" style="--rc:${rc}"><h3>Today's bookings</h3>`;
  day.book.forEach(b=>{h+=`<div class="item"><div class="it"><b>${esc(b.l)}</b><div class="desc"><span class="ref">${esc(b.r)}</span></div></div></div>`});h+=`</div>`}
 h+=`<div class="sec" style="--rc:${rc}"><h3>Notes for this day</h3>
     <textarea class="note" placeholder="Anything worth remembering — a change of plan, a place you loved, something to tell Claude to update later…" onchange="saveNote(this.value)">${esc(S.notes[curDay]||"")}</textarea></div>`;
 h+=`<div class="navRow"><button class="navBtn" onclick="toggleEdit()">${editing?"Done editing":"✎ Edit this day"}</button></div>`;
 h+=`<div class="footer">Ryan Family · Scandinavia 2026</div>`;
 return h}

function renderDays(){let h="";const ti=todayIdx();
 DATA.forEach((day,i)=>{h+=`<div class="dayRow ${i===ti?"today":""}" style="--rc:var(--${day.r})" onclick="curDay=${i};curTab='day';render()">
  <span class="dot"></span><div class="m"><b>${esc(day.city)}</b><span>${esc(day.sub)}</span></div>
  <span class="dn">${esc(day.dow)}<br>${fmtDate(day.d)}</span></div>`});
 h+=`<div class="footer">Tap any day to open it</div>`;return h}

function renderVault(){let h="";
 VAULT.forEach(g=>{h+=`<div class="vGroup"><h4>${esc(g.g)}</h4>`;
  g.rows.forEach(r=>{h+=`<div class="vRow"><div class="vt">${esc(r.t)}</div>${r.s?`<div class="vs">${esc(r.s)}</div>`:""}
   ${r.r?`<span class="ref">${esc(r.r)}</span><button class="copyRef" onclick="copyText('${esc(r.r)}')">copy</button>`:""}</div>`});
  h+=`</div>`});
 h+=`<div class="footer">Everything here works offline</div>`;return h}

function renderMore(){
 const prepDone=PREP.filter((_,i)=>S.prep[i]).length;
 let h=`<div class="tool"><h4>Pre-trip checklist · ${prepDone}/${PREP.length}</h4>`;
 PREP.forEach((p,i)=>{h+=`<div class="item ${S.prep[i]?"done":""}"><button class="chk" onclick="S.prep[${i}]=!S.prep[${i}];store.save(S);render()">✓</button><div class="it" style="font-size:14px">${esc(p)}</div></div>`});
 h+=`</div>`;
 h+=`<div class="tool"><h4>Currency</h4>
  <div class="convRow"><input type="number" id="cvAmt" inputmode="decimal" placeholder="Amount" value="100">
  <select id="cvCur"><option value="nok">NOK → USD</option><option value="dkk">DKK → USD</option></select></div>
  <div class="convOut" id="cvOut"></div>
  <div class="small" style="margin-top:6px">Rates used: NOK <input style="width:52px;border:1px solid var(--hair);border-radius:6px;padding:2px 4px;background:var(--paper)" id="rNok" value="${S.rate.nok}"> /USD · DKK <input style="width:52px;border:1px solid var(--hair);border-radius:6px;padding:2px 4px;background:var(--paper)" id="rDkk" value="${S.rate.dkk}"> /USD — editable, saved on device.</div></div>`;
 h+=`<div class="tool"><h4>Sync between phones</h4>
  <div class="small">Check-offs, notes and edits live on THIS phone only. To copy them to the other phone: Export here → send via iMessage → Import there.</div>
  <button class="btn primary" onclick="exportState()">Export my changes</button>
  <button class="btn" onclick="importState()">Import</button></div>`;
 h+=`<div class="tool"><h4>About this app</h4>
  <div class="small">Built from Live_Schedule_07012026.md. Works fully offline once loaded. To change the underlying itinerary (not just notes), ask Claude to regenerate the app and push the new index.html to GitHub — the app picks it up next time it opens online. Data version: 1.0 · Jul 1 2026.</div></div>`;
 h+=`<div class="footer">Ryan Family · Scandinavia 2026</div>`;return h}

function render(){
 renderVoyage();
 const views={day:renderDay,days:renderDays,vault:renderVault,more:renderMore};
 $("#app").innerHTML=views[curTab]();
 document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===curTab));
 document.body.classList.toggle("editing",editing&&curTab==="day");
 if(curTab==="more")wireConverter();
 window.scrollTo({top:0})}

/* actions */
window.toggleDone=k=>{S.done[k]=!S.done[k];store.save(S);render()};
window.saveNote=v=>{S.notes[curDay]=v;store.save(S)};
window.stepDay=n=>{curDay=Math.min(DATA.length-1,Math.max(0,curDay+n));render()};
window.goToday=()=>{curDay=todayIdx();render()};
window.toggleEdit=()=>{editing=!editing;render()};
window.editItem=(k,di,bi,ii,isCustom)=>{
 const ed=S.edits[k]||{};let base;
 if(isCustom){const list=S.custom[di+"."+bi]||[];base=list[parseInt(ii.slice(1))]||{}}
 else base=DATA[di].blocks[bi].items[ii];
 const nb=prompt("Title (blank = hide this item, or keep):",ed.b??base.b??"");
 if(nb===null)return;
 if(nb.trim()===""){S.hidden[k]=!S.hidden[k];store.save(S);render();return}
 const nd=prompt("Details:",ed.d??base.d??"");if(nd===null)return;
 S.edits[k]={b:nb,d:nd};store.save(S);render()};
window.addItem=(di,bi)=>{
 const b=prompt("New item title:");if(!b)return;
 const d=prompt("Details (optional):")||"";
 const key=di+"."+bi;S.custom[key]=S.custom[key]||[];S.custom[key].push({b,d});store.save(S);render()};
window.copyText=t=>{navigator.clipboard&&navigator.clipboard.writeText(t)};
window.exportState=()=>{
 const s=JSON.stringify(S);
 if(navigator.share){navigator.share({title:"Trip app sync",text:"RYANTRIP:"+btoa(unescape(encodeURIComponent(s)))}).catch(()=>{})}
 else{navigator.clipboard.writeText("RYANTRIP:"+btoa(unescape(encodeURIComponent(s))));alert("Copied to clipboard — paste it to Melissa via iMessage.")}};
window.importState=()=>{
 const t=prompt("Paste the exported text (starts with RYANTRIP:):");if(!t)return;
 try{const s=JSON.parse(decodeURIComponent(escape(atob(t.replace("RYANTRIP:","").trim()))));S=Object.assign(S,s);store.save(S);render();alert("Imported.")}
 catch(e){alert("That didn't parse — make sure the whole message was pasted.")}};
function wireConverter(){
 const f=()=>{const a=parseFloat($("#cvAmt").value)||0,c=$("#cvCur").value;
  S.rate.nok=parseFloat($("#rNok").value)||10;S.rate.dkk=parseFloat($("#rDkk").value)||6.9;store.save(S);
  const r=c==="nok"?S.rate.nok:S.rate.dkk;
  $("#cvOut").textContent=a+" "+c.toUpperCase()+" ≈ $"+(a/r).toFixed(2)+" USD"};
 ["cvAmt","cvCur","rNok","rDkk"].forEach(id=>$("#"+id).addEventListener("input",f));f()}

document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{curTab=b.dataset.tab;editing=false;render()});
window.addEventListener("online",()=>document.body.classList.remove("offline"));
window.addEventListener("offline",()=>document.body.classList.add("offline"));
if(!navigator.onLine)document.body.classList.add("offline");
curDay=todayIdx();render();
setInterval(()=>{if(curTab==="day"){const c=document.querySelector(".count");if(c)c.outerHTML=countdownHTML()}},30000);
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>

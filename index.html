<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Scandinavia">
<meta name="theme-color" content="#F1EDE2">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Ryan Family · Scandinavia 2026</title>
<style>
:root{
  --paper:#F1EDE2; --paper2:#EAE4D4; --ink:#14263A; --ink2:#4A5A6C; --faint:#8B93A0;
  --hair:#CFC6B0; --card:#FBF8F0;
  --travel:#5A6B8F; --fjord:#1E6E68; --capital:#9C4A2F; --cruise:#24466B; --denmark:#A63A46;
  --ok:#2E7D4F; --warn:#B5541C;
  --safe-b: env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  overscroll-behavior-y:none}
.serif{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
.mono{font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
a{color:inherit}
#app{max-width:640px;margin:0 auto;padding-bottom:calc(76px + var(--safe-b))}

/* ---------- voyage scrubber ---------- */
#voyage{position:sticky;top:0;z-index:40;background:linear-gradient(var(--paper) 82%,rgba(241,237,226,0));
  padding:10px 12px 14px}
#vTitle{display:flex;justify-content:space-between;align-items:baseline;padding:2px 4px 8px}
#vTitle .t{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-weight:600;font-size:15px;letter-spacing:.04em}
#vTitle .d{font-size:11px;color:var(--ink2);letter-spacing:.08em;text-transform:uppercase}
#track{position:relative;height:34px}
#trackLine{position:absolute;left:6px;right:6px;top:16px;border-top:2px dashed var(--hair)}
#ticks{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;padding:0 2px}
.tick{width:100%;height:34px;display:flex;align-items:center;justify-content:center;position:relative}
.tick i{display:block;width:7px;height:7px;border-radius:50%;background:var(--tc,var(--faint));opacity:.55;transition:all .15s}
.tick.cur i{width:15px;height:15px;opacity:1;box-shadow:0 0 0 3px var(--paper),0 0 0 4.5px var(--tc)}
.tick.today i::after{content:"";position:absolute;left:50%;top:-3px;transform:translateX(-50%);
  width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid var(--ink)}
/* ---------- day header ---------- */
.dayHead{margin:2px 12px 14px;padding:16px 16px 14px;background:var(--card);border:1px solid var(--hair);
  border-radius:14px;position:relative;overflow:hidden}
.dayHead::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--rc)}
.kick{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--rc);font-weight:700}
.city{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:30px;line-height:1.12;font-weight:600;margin:4px 0 2px}
.dsub{font-size:13px;color:var(--ink2)}
.lede{margin:10px 0 0;font-size:14.5px;color:var(--ink2);line-height:1.5}
.navRow{display:flex;justify-content:space-between;margin:0 12px 10px;gap:8px}
.navBtn{flex:1;padding:9px 0;border:1px solid var(--hair);border-radius:10px;background:var(--card);
  font-size:13px;font-weight:600;color:var(--ink2)}
.navBtn:active{background:var(--paper2)}
/* ---------- countdown ---------- */
.count{margin:0 12px 12px;padding:10px 14px;border-radius:12px;background:var(--ink);color:#F4EFE2;
  display:flex;justify-content:space-between;align-items:center;font-size:13.5px}
.count b{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:15px}
/* ---------- sections ---------- */
.sec{margin:0 12px 12px;padding:14px 16px;background:var(--card);border:1px solid var(--hair);border-radius:14px}
.sec h3{margin:0 0 8px;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);
  font-weight:700;display:flex;align-items:center;gap:8px}
.sec h3::after{content:"";flex:1;border-top:1px dashed var(--hair)}
.blockName{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-weight:700;font-size:16px;margin:12px 0 4px}
.blockName:first-of-type{margin-top:2px}
/* items */
.item{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--paper2);position:relative}
.item:last-child{border-bottom:none}
.chk{flex:none;width:22px;height:22px;margin-top:1px;border:1.6px solid var(--hair);border-radius:7px;
  display:flex;align-items:center;justify-content:center;color:transparent;font-size:13px;background:var(--paper)}
.item.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.item.done .it{opacity:.45;text-decoration:line-through}
.it{flex:1;min-width:0}
.it b{font-size:15px}
.it .desc{font-size:13.5px;color:var(--ink2);margin-top:1px}
.it .alt{font-size:13px;color:var(--faint);font-style:italic;margin-top:3px}
.it .time{display:inline-block;font-family:ui-monospace,"SF Mono",Menlo,monospace;font-weight:700;font-size:13px;
  color:var(--rc);margin-right:6px}
.links{margin-top:5px;display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--rc);
  border:1px solid var(--hair);border-radius:99px;padding:3px 10px;background:var(--paper);text-decoration:none}
.ref{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12.5px;background:var(--paper2);
  border-radius:6px;padding:1px 7px;letter-spacing:.03em}
.editBtn{flex:none;color:var(--faint);font-size:15px;padding:2px 4px;align-self:flex-start;display:none}
body.editing .editBtn{display:block}
body.editing .chk{display:none}
.item.hidden{display:none}
body.editing .item.hidden{display:flex;opacity:.35}
/* mini sections */
.mini{font-size:14px;line-height:1.55}
.mini + .mini{margin-top:8px}
.mini .lab{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;color:var(--rc);display:block;margin-bottom:2px}
.phraseBox{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.phraseBox .p{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:21px;font-weight:700}
.phraseBox .pr{font-size:13px;color:var(--ink2)}
.warnBox{border-left:4px solid var(--warn);background:#F7EEDF;border-radius:10px;padding:10px 12px;font-size:13.5px;margin-top:10px}
.warnBox b{color:var(--warn)}
/* notes */
textarea.note{width:100%;min-height:64px;border:1px dashed var(--hair);border-radius:10px;background:var(--paper);
  padding:10px;font:14px/1.5 -apple-system,sans-serif;color:var(--ink);resize:vertical}
/* ---------- list view ---------- */
.dayRow{display:flex;gap:12px;align-items:center;margin:0 12px 8px;padding:12px 14px;background:var(--card);
  border:1px solid var(--hair);border-radius:12px}
.dayRow .dot{flex:none;width:11px;height:11px;border-radius:50%;background:var(--rc)}
.dayRow .m{flex:1;min-width:0}
.dayRow .m b{font-size:15px}
.dayRow .m span{display:block;font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dayRow .dn{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11.5px;color:var(--faint)}
.dayRow.today{outline:2px solid var(--ink);outline-offset:-1px}
/* ---------- vault ---------- */
.vGroup{margin:0 12px 12px;background:var(--card);border:1px solid var(--hair);border-radius:14px;overflow:hidden}
.vGroup h4{margin:0;padding:11px 16px;font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink2);
  border-bottom:1px dashed var(--hair);background:var(--paper2)}
.vRow{padding:10px 16px;border-bottom:1px dashed var(--paper2);font-size:14px}
.vRow:last-child{border-bottom:none}
.vRow .vt{font-weight:600}
.vRow .vs{font-size:12.5px;color:var(--ink2);margin:1px 0 4px}
.copyRef{margin-left:6px;font-size:11px;color:var(--rc);font-weight:700}
/* ---------- more ---------- */
.tool{margin:0 12px 12px;padding:14px 16px;background:var(--card);border:1px solid var(--hair);border-radius:14px}
.tool h4{margin:0 0 8px;font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink2)}
.convRow{display:flex;gap:8px;align-items:center;margin-top:6px}
.convRow input{width:0;flex:1;border:1px solid var(--hair);border-radius:10px;padding:9px 10px;font:15px -apple-system,sans-serif;background:var(--paper)}
.convRow select{border:1px solid var(--hair);border-radius:10px;padding:9px 6px;background:var(--paper);font:14px -apple-system,sans-serif}
.convOut{margin-top:8px;font-size:15px;font-weight:700}
.btn{display:inline-block;border:1px solid var(--hair);border-radius:10px;background:var(--paper);padding:9px 14px;
  font-size:13.5px;font-weight:600;color:var(--ink);margin:4px 6px 0 0}
.btn.primary{background:var(--ink);color:#F4EFE2;border-color:var(--ink)}
.small{font-size:12.5px;color:var(--ink2)}
/* ---------- tabbar ---------- */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(251,248,240,.96);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-top:1px solid var(--hair);
  display:flex;max-width:640px;margin:0 auto;padding-bottom:var(--safe-b)}
#tabs button{flex:1;padding:10px 0 8px;font-size:11px;font-weight:600;color:var(--faint);
  display:flex;flex-direction:column;align-items:center;gap:3px;letter-spacing:.02em}
#tabs button .ic{font-size:19px;line-height:1}
#tabs button.on{color:var(--ink)}
.offlineBadge{position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);right:10px;z-index:60;font-size:10px;
  font-weight:700;letter-spacing:.08em;background:var(--ink);color:#F4EFE2;border-radius:99px;padding:3px 9px;display:none}
body.offline .offlineBadge{display:block}
.footer{margin:18px 12px 8px;text-align:center;font-size:11px;color:var(--faint);letter-spacing:.1em;text-transform:uppercase}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
.wx{display:flex;gap:10px;align-items:center;margin-top:8px;font-size:13.5px;color:var(--ink2)}
.wx b{font-weight:600;color:var(--ink)}
.wxHint{margin-top:8px;padding:9px 11px;border:1px dashed var(--rc,var(--faint));border-radius:9px;font-size:13px;color:var(--ink2);background:rgba(255,255,255,.4)}
.lore{border:1px solid var(--hair);border-radius:10px;margin:7px 0;background:rgba(255,255,255,.45);overflow:hidden}
.lore summary{padding:10px 12px;font-weight:600;font-size:14px;cursor:pointer;list-style:none;position:relative}
.lore summary::-webkit-details-marker{display:none}
.lore summary::after{content:"+";position:absolute;right:12px;top:8px;font-size:17px;color:var(--rc,var(--ink2));font-weight:400}
.lore[open] summary::after{content:"–"}
.lore .loreBody{padding:0 12px 11px;font-size:13.5px;line-height:1.55;color:var(--ink2)}

/* ---------- v2: travel chain ---------- */
.fbN{font-size:12.5px;color:var(--warn);background:rgba(181,84,28,.07);border-left:3px solid var(--warn);
  border-radius:0 8px 8px 0;padding:6px 9px;margin-top:5px;line-height:1.45}
.chain{position:relative;margin-top:2px}
.leg{display:flex;gap:11px;padding:9px 0;position:relative}
.leg .dot{flex:none;width:16px;height:16px;margin-top:3px;border-radius:50%;border:2px solid var(--hair);
  background:var(--paper);color:transparent;font-size:10px;display:flex;align-items:center;justify-content:center;z-index:1}
.leg:not(:last-child)::before{content:"";position:absolute;left:7px;top:24px;bottom:-9px;width:2px;background:var(--hair)}
.leg .lt{display:block;font-family:ui-monospace,"SF Mono",Menlo,monospace;font-weight:700;font-size:12.5px;color:var(--rc)}
.leg b{font-size:14.5px;display:block;margin-top:1px}
.leg .st{display:inline-block;margin-top:3px;font-size:11px;font-weight:700;letter-spacing:.04em;
  border-radius:99px;padding:2px 9px;background:var(--paper2);color:var(--ink2)}
.leg.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.leg.done b,.leg.done .lt{opacity:.5}
.leg.done:not(:last-child)::before{background:var(--ok)}
.leg.go .dot{border-color:var(--rc);box-shadow:0 0 0 3px var(--paper),0 0 0 4.5px var(--rc)}
.leg.go .st{background:var(--rc);color:#F4EFE2}
.leg.next .dot{border-color:var(--ink)}
.leg.next .st{background:var(--ink);color:#F4EFE2}
.buffer{margin:2px 0 2px 27px;font-size:11.5px;color:var(--faint);font-family:ui-monospace,Menlo,monospace;letter-spacing:.03em}
/* ---------- v2: NOW chip ---------- */
.nowChip{display:inline-block;margin-left:8px;font-family:-apple-system,sans-serif;font-size:9.5px;font-weight:800;
  letter-spacing:.12em;vertical-align:middle;background:var(--rc);color:#F4EFE2;border-radius:99px;padding:2px 8px}
/* ---------- v2: tomorrow card ---------- */
.tmr{margin:0 12px 12px;padding:13px 15px;border-radius:14px;background:var(--ink);color:#EFE9DA;cursor:pointer;
  font-size:13.5px;line-height:1.7}
.tmr .tmrK{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:#B9C2CE;font-weight:700}
.tmr .tmrCity{font-size:22px;font-weight:600;margin:1px 0 6px;color:#F4EFE2}
.tmr .tmrGo{margin-top:7px;font-size:12px;color:#AEB8C6;font-weight:600}
/* ---------- v2: checkout ---------- */
.coBar{font-size:11px;font-weight:700;color:var(--faint);font-family:ui-monospace,Menlo,monospace}
h3 .coBar{margin-left:auto}
/* ---------- v2: scavenger hunt ---------- */
.scoreWrap{display:flex;gap:10px;margin:2px 12px 10px}
.scoreCard{flex:1;background:var(--card);border:1px solid var(--hair);border-radius:14px;padding:12px 8px;text-align:center;transition:all .2s}
.scoreCard.lead{border-color:var(--rc,var(--ink));box-shadow:0 0 0 2px var(--rc,var(--ink)) inset}
.scoreCard .nm{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--ink2)}
.scoreCard .pt{font-size:34px;line-height:1.1;font-weight:700}
.huntLead{margin:0 12px 12px;font-size:13px;color:var(--ink2);text-align:center;line-height:1.5}
.hItem{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--paper2)}
.hItem:last-child{border-bottom:none}
.hItem .ht{flex:1;font-size:14px;line-height:1.35}
.hItem.claimed .ht{opacity:.55}
.hItem .hPts{font-size:11px;font-weight:700;color:var(--faint);font-family:ui-monospace,Menlo,monospace}
.cl{flex:none;width:30px;height:30px;border:1.6px solid var(--hair);border-radius:9px;font-weight:800;font-size:13px;color:var(--ink2);background:var(--paper)}
.cl.onG{background:var(--fjord);border-color:var(--fjord);color:#fff}
.cl.onD{background:var(--capital);border-color:var(--capital);color:#fff}
/* ---------- v2: QR ---------- */
#qrBox{margin-top:12px;text-align:center}
#qrBox svg{width:220px;height:220px;background:#fff;padding:8px;border-radius:12px;border:1px solid var(--hair)}
.qrCap{font-size:12.5px;color:var(--ink2);margin-top:9px;line-height:1.5;text-align:left}

/* ---------- v3: hunt 2.0 ---------- */
.chDates{font-size:11px;color:var(--faint);font-weight:600;margin-left:4px}
.prizeBox{position:relative;background:var(--paper2);border:1px dashed var(--hair);border-radius:11px;padding:9px 40px 9px 12px;margin:4px 0 10px}
.pzLab{font-size:9.5px;font-weight:800;letter-spacing:.12em;color:var(--warn)}
.pzTxt{font-size:14px;font-weight:600;margin-top:2px;line-height:1.35}
.pzEdit{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:28px;height:28px;border:1px solid var(--hair);border-radius:8px;background:var(--paper);color:var(--ink2)}
.pRow{display:flex;align-items:center;gap:8px;margin:5px 0}
.pWho{flex:none;width:52px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.pTrack{flex:1;height:10px;border-radius:99px;background:var(--paper2);border:1px solid var(--hair);overflow:hidden}
.pFill{height:100%;border-radius:99px;transition:width .3s}
.pPts{flex:none;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;font-weight:700}
.pzWin{margin:7px 0 4px;padding:8px 11px;border-radius:10px;background:var(--ink);color:#F4EFE2;font-size:13px;font-weight:700;text-align:center}
.mTag{font-size:8.5px;font-weight:800;letter-spacing:.1em;color:#fff;background:var(--warn);border-radius:4px;padding:1.5px 5px;vertical-align:1.5px}
.hDay{font-size:10.5px;color:var(--faint);font-weight:600}
#toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(20px);max-width:86%;background:var(--ink);color:#F4EFE2;font-size:13.5px;font-weight:600;line-height:1.4;padding:11px 16px;border-radius:13px;opacity:0;pointer-events:none;transition:all .3s;z-index:99;box-shadow:0 6px 24px rgba(20,32,42,.35)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* ---------- v3: memory log ---------- */
.whoRow{display:flex;gap:7px;margin-bottom:8px}
.whoChip{flex:1;padding:8px 0;border:1.4px solid var(--hair);border-radius:99px;background:var(--paper);font-size:13px;font-weight:700;color:var(--ink2)}
.whoChip.on{background:var(--ink);border-color:var(--ink);color:#F4EFE2}
.logDate{margin:16px 14px 6px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.logCard{margin:0 12px 10px;background:var(--card);border:1px solid var(--hair);border-radius:14px;padding:11px 13px}
.logPh{width:100%;border-radius:10px;margin-bottom:8px;min-height:40px;background:var(--paper2)}
.logTxt{font-size:14.5px;line-height:1.5}
.logMeta{display:flex;justify-content:space-between;align-items:center;margin-top:7px}
.logWho{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--warn)}
.logDel{border:none;background:none;color:var(--faint);font-size:11.5px;text-decoration:underline dotted}
/* ---------- v3: odometer + dispatch ---------- */
.odoStrip{margin:0 12px 12px;text-align:center;font-size:12px;color:var(--ink2);font-family:ui-monospace,Menlo,monospace;line-height:1.6}
.odoBig{font-size:38px;font-weight:700;color:var(--ink);margin:2px 0 8px}
.odoRow{display:flex;justify-content:space-between;font-size:14px;padding:5px 0;border-bottom:1px dashed var(--paper2)}
.odoRow:last-of-type{border-bottom:none}
/* ---------- v3: phrasebook ---------- */
.phRow{display:flex;align-items:baseline;gap:8px;padding:6px 0;border-bottom:1px dashed var(--paper2);flex-wrap:wrap}
.phRow:last-child{border-bottom:none}
.phE{flex:1 1 110px;font-size:12.5px;color:var(--ink2)}
.phP{font-size:15px;font-weight:700}
.phPr{font-size:11.5px;color:var(--faint);font-family:ui-monospace,Menlo,monospace}
/* ---------- v3: 6-tab bar ---------- */
#tabs button{padding:7px 0 6px;font-size:9.5px}
#tabs .ic{font-size:17px}
</style>
</head>
<body>
<div class="offlineBadge">Offline · Saved copy</div>
<div id="voyage">
  <div id="vTitle"><span class="t serif">Scandinavia 2026</span><span class="d" id="vDate"></span></div>
  <div id="track"><div id="trackLine"></div><div id="ticks"></div></div>
</div>
<div id="app"></div>
<nav id="tabs">
  <button data-tab="day" class="on"><span class="ic">☀︎</span>Today</button>
  <button data-tab="days"><span class="ic">☰</span>Days</button>
  <button data-tab="vault"><span class="ic">⚓︎</span>Vault</button>
  <button data-tab="hunt"><span class="ic">✦</span>Hunt</button>
  <button data-tab="log"><span class="ic">✎</span>Log</button>
  <button data-tab="more"><span class="ic">✚</span>More</button>
</nav>

{d:"2026-07-09",dow:"Thu",city:"Bergen",sub:"Fløyen · trolls · canoes · Bryggen",r:"fjord",
 lede:"The classic Bergen day, timed to stay ahead of three cruise ships: up the mountain early, canoes at the lake, down on foot, then the medieval alleys once the tour groups thin.",
 blocks:[
  {n:"Morning",items:[
   {b:"Skillingsbolle on the walk",d:"Baker Brun's Bryggen 27 shop (Svensgården, 4.3★ from ~950 reviews, opens 7 AM Thursdays) — Bergen's own cinnamon roll, flatter and more caramelized than the ones at home. It's on the way to the funicular.",q:"Baker Brun Svensgården, Bryggen 27, Bergen"},
   {b:"Fløibanen funicular at 9:30",d:"Ride up before the ship crowds build. ~1 hr at the summit: seven-mountains panorama, then the Troll Forest.",q:"Fløibanen, Bergen",u:"https://www.floyen.no/en"},
   {b:"Lake Skomakerdiket canoes",d:"Flat 10–15 min walk from the summit. Free canoes, paddles and life jackets from 11:00 — arrive ~10:45 to be first in line. Max 3 per boat; Declan paddles with an adult.",q:"Skomakerdiket, Bergen"},
   {b:"Hike down Fløysvingene",d:"~1 hr, gravel/asphalt the whole way, harbor-neighborhood views on the descent. In town by ~1 PM.",a:"Rain pivot: flip the day — Bryggen alleys first, shift Fløyen to tomorrow morning."}]},
  {n:"Midday",items:[
   {b:"Trekroneren hot dog cart",d:"Kong Oscars gate 1, at the foot of the funicular. The reindeer sausage in lompe with lingonberry, spicy mustard and fried onions. It's enormous.",q:"Trekroneren, Kong Oscars gate 1, Bergen"}]},
  {n:"Afternoon",items:[
   {b:"Bryggen alleyways",d:"The real experience is the narrow medieval passages behind the colorful facades — artisan shops, silverwork, ceramics. Best after 3 PM when tour groups thin.",q:"Bryggen, Bergen"},
   {b:"Outland Bergen with the boys",d:"Strandkaien 14, open to 6 PM Thursdays. Pokémon cards, manga, gaming — the browse is the fun.",q:"Outland Bergen, Strandkaien 14, Bergen",a:"Bigger alternate: Gamle Bergen Museum in Sandviken — free grounds, costumed actors, ~2 hrs, short bus ride."}]},
  {n:"Evening",items:[
   {b:"Self-cater at the Airbnb",d:"Then a waterfront walk in the long light — Bergen stays bright until nearly 11 PM.",a:"Backup: Pingvinen (Vaskerelven 14, from noon) — plukkfisk, fish soup, or reindeer steak."}]}],
 lore:[
  {t:"Why Bryggen leans",d:"German Hanseatic merchants ran a dried-cod empire from these wharves for 400 years. The buildings burned and were rebuilt on the same medieval foundations after the 1702 fire — which is why they lean on each other like they've had a long night. Teenage apprentices, some Gavin's age, lived in the unheated lofts: open flames were banned, winters were brutal, and dinner was usually the cod they were selling."},
  {t:"Troll rules",d:"Official Norwegian folklore: trolls turn to stone in sunlight, which conveniently explains every oddly-shaped boulder in the country. They smell terrible, hate church bells, and are not great thinkers. If something in Trollskogen smells weird, that's a troll. Probably."},
  {t:"Kvikk Lunsj law",d:"Norway's hiking chocolate since 1937 — roughly nine bars per Norwegian per year, most of them eaten on a mountain. Carrying one on a hike is closer to law than custom. You are now subject to this law."}],
 phrase:{p:"Takk",pr:"tahk",e:"Thanks — the single most-used word of the next two weeks."},
 boys:"The troll hunt in Trollskogen: no official count of carved trolls exists — the mission is to find more than anyone thinks possible. Then free canoes on a mountain lake.",
 eyes:["From the summit, count the seven mountains that ring the city.","In the Bryggen alleys, look up: the buildings lean into each other like they're sharing secrets.","The funicular's front window is the best seat — grab it going up."],
 customs:"Quiet voices on the funicular and buses — Norwegians keep public transit library-calm, and it's the fastest way for the boys to pass as locals.",
 book:[{l:"Fløibanen tickets",r:"buy day-of in app / floyen.no"}]},

{d:"2026-07-10",dow:"Fri",city:"Bergen",sub:"Fortress · fjord swim · last Bergen night",r:"fjord",
 lede:"Lightest cruise day of the stay. A 13th-century tower in the morning, a heated saltwater pool with a fjord diving board in the afternoon, and bags packed before bed — the ferry waits for no one.",
 blocks:[
  {n:"Morning",items:[
   {b:"Bergenhus Fortress + Rosenkrantz Tower",d:"Free grounds at the harbor mouth. The tower (~150 NOK/adult, under-18 free) climbs from 13th-century dungeons past a royal bedchamber to a cannon rooftop with the best harbor view in Bergen.",q:"Rosenkrantz Tower, Bergen",a:"Håkon's Hall (120 NOK) optional — 20 min if energy holds. Bryggens Museum is closed Fridays — not an option today."},
   {b:"St. Mary's Church on the way past",d:"2-min walk from the fortress — oldest building in Bergen (1130s). A quick look is enough.",q:"St Mary's Church Mariakirken, Bergen"}]},
  {n:"Midday",items:[
   {b:"Picnic on the fortress lawns",d:"Bread and cheese from Extra Øvregaten (across the street from the apartment, open from 7 AM) — the ramparts beat any restaurant nearby.",q:"Extra Øvregaten, Øvregaten 37, Bergen",a:"Or Kafé Spesial (Christies gate 13): vegetarian pizza or shakshuka, chocolate fondant after."}]},
  {n:"Afternoon",items:[
   {b:"Nordnes Peninsula walk",d:"15–20 min from Bryggen along the harbor edge the whole way.",q:"Nordnes park, Bergen"},
   {b:"Nordnes Sjøbad — the Bergen swim",d:"Heated 30°C saltwater pool, sauna on site, and a diving board that launches straight into the fjord. Family ticket available (~120 NOK/adult).",q:"Nordnes Sjøbad, Nordnesbakken 4, Bergen",a:"Rain: Bergen Aquarium is literally next door. Bigger rain pivot: KODE/Rasmus Meyer — largest Munch collection outside Oslo, open Fridays."}]},
  {n:"Evening",items:[
   {b:"Last Bergen dinner",d:"Pingvinen (Vaskerelven 14) or Kafé Spesial — whichever wasn't used at lunch. Both walk-in friendly.",q:"Pingvinen, Vaskerelven 14, Bergen"}]}],
 warn:"Pack tonight and set alarms: Norled departs 08:00 sharp tomorrow from Strandkaiterminal — be there by 7:40.",
 lore:[
  {t:"The tower that survived a shipload of dynamite",d:"On April 20, 1944, the Dutch cargo ship Voorbode — loaded with 120 tons of German explosives — blew up at the quay below the fortress. It flattened much of the harbor and badly damaged both Rosenkrantz Tower and Håkon's Hall. Both were rebuilt; on the climb, look for where the medieval stone stops and the 1950s stone begins."},
  {t:"Bergen before Oslo",d:"For most of the Middle Ages Bergen was Norway's largest city and its real capital — at one point the biggest city in all of Scandinavia. Oslo is the newcomer. Bergensers have not entirely let this go."},
  {t:"The pool in the sea",d:"Nordnes Sjøbad opened in 1910: the pool is heated to 30°C, the fjord beside it very much is not. Jumping off the diving board into the actual fjord is the local kids' rite of passage. The gasp is part of the experience."}],
 phrase:{p:"Vær så snill",pr:"vair saw SNILL",e:"Please — literally 'be so kind.'"},
 boys:"Dungeon-to-rooftop-cannon climb in the morning, fjord diving board in the afternoon. Arguably their best one-two day of the trip.",
 eyes:["Original 13th-century stonework in the tower's lower rooms — put a hand on it.","From the cannon roof, spot tomorrow's ferry route out of the harbor.","Cobblestones on the fortress grounds are ship's ballast — Bergen was built from what boats didn't need."],
 customs:"Tipping in Norway: genuinely not expected. Round up or add ~10% only if service was great — never at counters or casual spots.",
 book:[{l:"Rosenkrantz Tower",r:"pay at door"}]},

 lore:[
  {t:"King of the fjords",d:"The Sognefjord is 205 km long and 1,308 m deep — deeper than the North Sea. Under the ferry, the mountain walls keep plunging down about as far as they rise above you. The boys are floating over a drowned canyon."},
  {t:"Two statues, one Kaiser",d:"German Kaiser Wilhelm II vacationed in Balestrand nearly every summer and loved the local Viking sagas. In 1913 he gifted the King Bele statue on Holmen and the 10.5-meter Fridtjov you can spot across the fjord at Vangsnes. One year later World War I began and he never came back."},
  {t:"Dragon houses",d:"Balestrand's 1890s villas are 'dragon style' — Swiss chalets with Viking dragon heads snarling from the gables, built by painters who came for the fjord light and stayed. Count the dragons on the evening walk."}],

 lore:[
  {t:"Why the water is that color",d:"The green-blue milkiness is glacial rock flour — stone ground to dust by glaciers upstream, carried down in snowmelt, scattering the light. The prettier the color, the colder the plunge. Today you can test this personally."}],
 phrase:{p:"Det smaker godt",pr:"deh SMAH-ker got",e:"It tastes good — deploy on any host or cook and watch them light up."},

 customs:"Norway's allemannsretten — the right to roam. You can walk, picnic and swim on almost any uncultivated land. The trail crossing farm fences is normal and legal; close every gate behind you.",

{d:"2026-07-13",dow:"Mon",city:"Balestrand",sub:"Fishing with Captain Tor · cook your catch",r:"fjord",
 lede:"The marquee Balestrand day: out on the Esefjord with Captain Tor around midday, then the whole point of the exercise — pan-frying your own catch for dinner.",
 blocks:[
  {n:"Morning",items:[{b:"Easy morning",d:"Coffee, balcony, fjord. Keep it light ahead of the boat; pack a picnic from groceries."}]},
  {n:"Midday — Fishing trip [CONFIRMED]",items:[
   {b:"Captain Tor — LEGACY 3-hr, CONFIRMED 12:00",d:"Legacy tour · 3 hrs · 5000 NOK · card on arrival · private boat, your group only. Be at the Balestrand Adventure House at 11:45, dressed for the water. Meeting point, time and Tor's phone: reconfirm against his confirmation email before you go.",q:"Balestrand Adventure, Balestrand"},
   {b:"What the Legacy tour includes",d:"Dragon-villa sightseeing with Tor's storytelling, rod fishing for sand whiting (\"fjord chicken\") in the Esefjord, trolling — and the pre-set net haul: pulling up a mystery net not knowing what's inside. Crab, starfish, sea urchin, odd fish. That moment is why you booked the 3-hour.",},
   {b:"Inge Menes bare-boat — open option, zero strings",d:"Not a formal booking — just an email thread; she said she should have boats and to call when you're in town (+47 950 41 651). If the family wants extra water time after Tor, ring her. If not: nothing to cancel, nothing bills."}]},
  {n:"Afternoon",items:[{b:"Clean the fish at the dock",d:"Then back to the apartment."}]},
  {n:"Evening",items:[
   {b:"Cook your own catch — stekt fisk",d:"Classic Norwegian pan-fried fish: salt, butter, lemon, dill — with boiled new potatoes and peas. Light candles, the whole bit. One of the best dinners of the trip, and the boat day exists to make it happen."}]}],
 lore:[
  {t:"Fjord chicken",d:"Sand whiting earned the nickname 'fjord chicken' by being mild, abundant, and impossible to dislike. The Esefjord arm stays calm even when the main fjord doesn't — it's where Balestrand families have always filled the pan."},
  {t:"What's in the net?",d:"Pre-set nets are how fjord households fished for centuries: set at dusk, hauled next day, dinner decided by luck. Crab is the jackpot. Starfish gets thrown back. Sea urchin gets photographed and then thrown back."}],
 phrase:{p:"Tusen takk",pr:"TOO-sen tahk",e:"A thousand thanks — for Captain Tor, after the catch."},
 boys:"Catching dinner with their own hands — and if the Legacy tier wins, hauling a net with no idea what's inside: crab, starfish, sea urchin, odd fish.",
 conn:"Expect dead zones out on the water — tell anyone expecting texts that you'll surface by late afternoon.",
 book:[{l:"Captain Tor 12:00 slot",r:"confirmed by email"},{l:"Inge Menes backup boat",r:"+47 950 41 651"}]},

{d:"2026-07-14",dow:"Tue",city:"Balestrand → Lofthus",sub:"Ferry · Flåmsbana · rail · bus — the big chain",r:"fjord",
 lede:"Four vehicles, one spectacular day: express ferry down the Aurlandsfjord, one of the world's steepest railways up to Myrdal, rail to Voss, bus over to the Hardangerfjord. Every leg is booked; the buffers are built in.",
 transit:[
  {t:"11:58",l:"Norled ferry Balestrand → Flåm",ref:"#2542170371"},
  {t:"14:45",l:"Flåmsbana Flåm → Myrdal",ref:"OGD-QDL-A3T",fb:"Free seating — be in line 25–30 min before departure; rear cars run emptiest. Sit on the RIGHT going up."},
  {t:"15:56",l:"R40 Myrdal → Voss",arr:"16:51",ref:"SUA-CW4-YVS",fb:"If this runs late and the 18:01 bus is missed: next 990 isn\u2019t until ~22:16 — use the Ullensvang front desk\u2019s taxi contact instead (~NOK 1,000–1,300 from Voss; the hotel was pre-flagged)."},
  {t:"18:01",l:"Skyss Bus 990 Voss Tinghus → Lofthus kai · pay in Skyss app",arr:"19:20",ref:"~$21–24/pp",app:{n:"Skyss",u:"https://www.skyss.no/en/"}}],
 blocks:[
  {n:"Morning",items:[
   {b:"Coffee + breakfast at the apartment",d:"The usual home routine — no sit-down this morning. If anyone's earned a treat, grab a to-go pastry or soft serve from Fløyfisken (Holmen 2) and eat it by the water while you wait for the ferry.",q:"Fløyfisken, Holmen 2, Balestrand"},
   {b:"St. Olaf's Church — 10 minutes",d:"Free, 5-min walk. The striking 1897 neo-stave church said to have inspired the Frozen coronation chapel. Worth the glance on the way out.",q:"St Olaf's Church, Balestrand"},
   {b:"Pack a travel lunch",d:"From Joker leftovers — it's a long chain with thin food options."}]},
  {n:"Evening — arrive Lofthus",items:[
   {b:"Check in — Hotel Ullensvang",d:"Family Junior Suite. Lofthus kai is ~5 min from the hotel.",q:"Hotel Ullensvang, Lofthus"},
   {b:"Grieg's composer cabin on the grounds",d:"'Komposten' — free, in the garden, where Edvard Grieg composed during summer stays."},
   {b:"Easy dinner",d:"Bunnpris (Sjoarvegen 18, open to 8 PM Tue) for a light supermarket dinner, or Lofthus Ekspedisjon on the fjord (open to 22:00) if energy holds.",q:"Lofthus Ekspedisjon, Lofthus"}]}],
 warn:"If the R40 runs late and you miss the 18:01 bus, the next 990 isn't until ~22:16 — have the Ullensvang front desk's taxi contact ready (~NOK 1,000–1,300 from Voss). The hotel was pre-flagged about a possible late transfer.",
 lore:[
  {t:"Ferry leg: into the Aurlandsfjord",d:"The boat turns off the main Sognefjord into the narrower Aurlandsfjord for the last stretch to Flåm — walls to ~1,700 m with tiny farms clinging partway up. Find one and ask the boys how the groceries get home."},
  {t:"Flåmsbana: the improbable railway",d:"20 km, 865 m of climb, gradients to 5.5% — one of the steepest standard-gauge railways on earth, opened 1940 after 20 years of building; 18 of its 20 tunnels were dug by hand. SIT ON THE RIGHT going up: the river, the valley drops and the best waterfalls (Rjoandefossen is the stunner) are on that side. Seating is free — be in line 25–30 min early; the rear cars run emptiest."},
  {t:"Kjosfossen and the lady in red",d:"Near the top the train stops ~5 minutes at a platform in the spray of the 225-m Kjosfossen (hoods up, phones under jackets). Then music starts — and a Huldra appears dancing on the ruins by the falls. In folklore she's the forest spirit: beautiful from the front, hollow as a rotten log from behind, cow's tail tucked away, famous for luring men into the woods. She's played by students of the Norwegian Ballet School, every train, June–August. Dad stays on the platform."},
  {t:"The Berekvam meet",d:"The line is single-track; the only passing loop is Berekvam station, where your train pauses while the downhill one slides by. It's not a delay — it's choreography."}],
 phrase:{p:"Fjord og fjell",pr:"fyoor oh FYELL",e:"Fjord and mountain — today's entire itinerary in three words."},
 boys:"The Flåmsbana drops through 20 tunnels on one of the steepest standard railways anywhere — watch for the waterfall stop on the way up.",
 conn:"The rail chain runs through long tunnels and remote valleys — offline maps for Flåm + Hardanger should already be downloaded. Don't burn battery hunting for signal.",
 book:[{l:"Hotel Ullensvang",r:"Family Junior Suite"}]},

{d:"2026-07-15",dow:"Wed",city:"Lofthus",sub:"Ullensvang Bath · Elvadalen waterfalls",r:"fjord",
 lede:"Hardanger settles in: a morning in the hotel's 88-meter swim channel, an easy river-valley hike to two waterfalls, and an early burger dinner — KOMPAEN closes at six sharp.",
 blocks:[
  {n:"Morning",items:[
   {b:"Slow hotel breakfast, then the Ullensvang Bath",d:"88m swimming channel, multiple saunas — included for guests. Pack a picnic from Bunnpris before heading out.",q:"Hotel Ullensvang, Lofthus"}]},
  {n:"Late morning",items:[
   {b:"Elvadalen (River Valley) hike",d:"3.5-mi loop, 1.5–2 hrs, ~120m gain, along the Opo river through orchards to the Bjødnabykset and Skrikjo waterfalls. First kilometer is steep, then it evens out.",q:"Elvadalen, Lofthus",a:"Look for the rock with ancient drilled pagan holes on the left — the info board explains it."}]},
  {n:"Afternoon",items:[{b:"Pool, fjord beach, lawn time",d:"Optional cold plunge in the Hardangerfjord after the hike."}]},
  {n:"Evening",items:[
   {b:"Early dinner at KOMPAEN Bistro og Deli",d:"Ullensvangveien 887, 3-min walk. Family-owned, open Wed–Sun until 6 PM ONLY — target ~5 PM seating. The Angus burger is the raved-about pick; fish & chips solid.",q:"KOMPAEN Bistro og Deli, Lofthus",a:"If the hike runs long past KOMPAEN's hard close: Lofthus Ekspedisjon (open to 22:00) — interchangeable with tomorrow's dinner."}]}],
 warn:"Tonight or tomorrow morning: ask the front desk about a packed breakfast box for Friday's ~6:40 AM walk-out — confirm what time it can be ready.",
 lore:[
  {t:"Grieg's garden hut",d:"Edvard Grieg — Norway's greatest composer, and the boys already know 'In the Hall of the Mountain King' whether they know it or not — spent summers at this hotel and composed in the little garden hut, 'Komposten.' He demanded total silence to work. The hotel, sensibly, obliged."},
  {t:"Monks planted this",d:"English monks brought orchard-keeping to the Opedal farm here roughly 800 years ago. The deep fjord stores summer heat like a radiator, which is how half a million fruit trees thrive at the latitude of Anchorage, Alaska."}],
 phrase:{p:"Eple",pr:"EH-pleh",e:"Apple — you're standing in Norway's orchard. 500,000+ fruit trees around you."},
 boys:"Waterfall spray at Skrikjo, the mystery pagan holes, and an 88-meter pool channel back at the hotel.",
 snacks:"At Bunnpris: skolebrød (custard bun with coconut), a tube of Norwegian kaviar for knekkebrød, and another Solo for the trail.",
 conn:"Farm trails and higher ground are patchy; the village and hotel are fine.",
 book:[]},

{d:"2026-07-16",dow:"Thu",city:"Lofthus",sub:"Fruit Trail · cider farms · pre-dawn prep",r:"fjord",
 lede:"The Hardanger Fruit Trail at a stroll — drop-in cider farms, juice tastings for the boys, orchard picnic — then buttoned-up prep for tomorrow's high-stakes 6:55 bus.",
 blocks:[
  {n:"Late morning",items:[
   {b:"Hardanger Fruktstien (Fruit Trail)",d:"Paved paths through the orchards around the hotel — fruit growing here started 800 years ago at Opedal farm. 2–3 hrs at a leisurely pace with stops.",q:"Lofthus, Ullensvang"},
   {b:"Alvavoll Frukt & Sidergard",d:"Opedalsvegen 39 — drop-in cider flight and snacks, Mon–Sat in summer.",q:"Alvavoll frukt og sidergard, Lofthus"},
   {b:"Lofthus Sideri",d:"Lofthusvegen 49, Mon–Sat 10–18. Drop-in tastings, juice tastings for the kids, ~170 NOK/bottle.",q:"Lofthus Sideri, Lofthus",a:"Optional adds: Opedalstunet walk-in shop on the trail; Helleland Gard is intimate but remote — skip if it's a stretch."}]},
  {n:"Afternoon",items:[{b:"Orchard picnic, then pool / fjord beach",d:"Picnic on the trail — orchard grass, fjord views."}]},
  {n:"Late afternoon — DEPARTURE PREP",items:[
   {b:"Pack tonight",d:"Everything but toothbrushes. 6:00 AM wake tomorrow."},
   {b:"Confirm the breakfast box",d:"With the front desk, if not already done."},
   {b:"Arrange the standby taxi",d:"Soft hold for 6:40 AM via the concierge in case Bus 990 has issues — no charge unless used."}]},
  {n:"Evening",items:[
   {b:"Dinner at Lofthus Ekspedisjon",d:"Sjoarvegen 27, on the fjord with their own dock, open to 22:00. Wood-fired pizza and a flight of house Hardanger ciders.",q:"Lofthus Ekspedisjon, Lofthus"}]}],
 warn:"Tomorrow is the trip's highest-stakes morning: 6:00 wake, 6:40 walk to the kai, 6:55 bus. Alarms on both phones AND the spare.",
 lore:[
  {t:"Cider with a passport",d:"'Sider frå Hardanger' holds protected-designation status — the Champagne rule: only cider grown and pressed in Hardanger may carry the name. The apple juice the boys taste comes off the same presses. Same terroir, less paperwork."}],
 phrase:{p:"Skål!",pr:"skawl",e:"Cheers! — with cider, in the region that invented Norwegian cider."},
 boys:"Juice tastings poured like wine flights, and permission to eat a picnic in someone's orchard (that's the right-to-roam again).",
 eyes:["Fruit trees planted in rows dating back generations — some farms here are on their 20th generation of the same family.","The Folgefonna glacier across the fjord, hanging white above the orchards."],
 book:[]},

{d:"2026-07-17",dow:"Fri",city:"Lofthus → Oslo",sub:"HIGH STAKES · pre-dawn bus + Bergen Railway",r:"capital",
 lede:"The one morning with zero slack: 6:55 bus to Voss, then five hours on the Bergen Railway across the roof of Norway into Oslo. After that, the trip downshifts into city mode.",
 transit:[
  {t:"06:55",l:"Skyss Bus 990 Lofthus kai → Voss · wake 6:00, walk 6:40",arr:"08:25",ref:"Skyss app",app:{n:"Skyss",u:"https://www.skyss.no/en/"},fb:"Bus fails → standby taxi arranged via Ullensvang (~NOK 3,000–4,000, ~90 min to Voss)."},
  {t:"09:20",l:"Vy F4 Voss → Oslo S · Carriage 7, seats 17/18/21/22",arr:"15:09",ref:"6P3-IOE-EID",fb:"Missed the train → rebook at vy.no; departures run all day."}],
 blocks:[
  {n:"Afternoon — arrive Oslo",items:[
   {b:"Uber from Oslo S to Majorstuen",d:"Airbnb host Margareth Aurora · Pilestredet 53C.",q:"Pilestredet 53C, Oslo",ref:"HMAWRADHED"}]},
  {n:"Evening",items:[
   {b:"Breakfast groceries: Extra Bislett",d:"Pilestredet 73, ~4 min from the apartment (4.1★, open to 11 PM). Stock mornings for the Oslo stay — note it closes Sundays, so cover the weekend tonight or Saturday.",q:"Extra Bislett, Pilestredet 73, Oslo"},
   {b:"Cafe Laundromat",d:"Underhaugsveien 2, ~6 min walk — café-meets-laundromat, cheeseburgers, books, beers, open to midnight.",q:"Cafe Laundromat, Underhaugsveien 2, Oslo",a:"Or Digg Pizza Majorstuen (Bogstadveien 62) — build-your-own, iPad ordering, very kid-friendly."},
   {b:"Know your two neighborhood spots",d:"Groceries: KIWI St. Olavs Plass 3, the closest supermarket (open to 11 PM). Morning pastries for all three Oslo days: Encore Kafe & Konditori, Pilestredet 75C — on your own street, 4.9★ from 330 reviews, \"best pastries in Oslo\" comes up repeatedly. Pain au chocolat and the pistachio ones are the raves. Opens 8 AM.",q:"Encore Kafe og Konditori, Pilestredet 75C, Oslo"}]}],
 warn:"Backup if the bus fails: the standby taxi arranged yesterday via Ullensvang (~NOK 3,000–4,000, ~90 min to Voss). Missed train: rebook at vy.no.",
 lore:[
  {t:"The line that took thirty years",d:"The Bergen Railway opened in 1909 — thousands of 'rallare' (navvies) blasted 182 tunnels through the mountains, mostly with hand drills and dynamite. Their old supply road, the Rallarvegen, still runs beside the track; watch for cyclists on it near the top."},
  {t:"Where to look",d:"Voss→Myrdal: LEFT side for the Raundalen gorge and its waterfalls. After Myrdal the trees give up and the RIGHT side owns the show — the Hardangervidda, northern Europe's largest mountain plateau, with the Hardangerjøkulen glacier on clear days. Your seats are fixed (Car 7), so trade windows at the highlights — or camp in the café car, which has big windows and no seat politics."},
  {t:"Finse = Hoth",d:"Finse station, 1,222 m, is the line's highest stop — no roads in, rail or boots only. Amundsen trained his South Pole dogs here. And in 1979, the Empire Strikes Back crew filmed the ice-planet Hoth battle on the glacier above it. Tell the boys at the right moment: out that window is Star Wars."},
  {t:"The invisible summit",d:"Minutes after Finse the train enters the 10.3-km Finse Tunnel and crosses the line's true high point — 1,237 m — in total darkness. The most anticlimactic summit in world railroading."}],
 phrase:{p:"Unnskyld",pr:"OON-shill",e:"Excuse me — the essential city word, starting today."},
 boys:"The Bergen Railway is one of Europe's great train rides — snowfields in July possible near the top. Breakfast box on laps, five hours of scenery.",
 conn:"Long tunnels most of the morning. By Oslo you're back to full-strength city coverage for the rest of Norway.",
 book:[{l:"Vy train",r:"6P3-IOE-EID"},{l:"Oslo Airbnb · Margareth Aurora",r:"HMAWRADHED"}]},

{d:"2026-07-18",dow:"Sat",city:"Oslo",sub:"Vigeland · Grünerløkka",r:"capital",
 lede:"Oslo's two personalities in one day: 200 bronze humans in a monumental park, then the indie-coffee-and-street-art side of the river. (The Reptile Park was cut — recent reviews say tiny, crowded, overpriced. The boys' big stop is tomorrow's polar ship.)",
 blocks:[
  {n:"Morning",items:[
   {b:"Vigeland Park",d:"~10 min walk west, free, open 24/7. 1.5–2 hrs among 200+ Gustav Vigeland sculptures: the Monolith, the Bridge, and Sinnataggen — the famous furious toddler.",q:"Vigeland Park, Oslo",a:"Rain pivot: VIKINGR at the Historical Museum (NOK 160/adult, under-18 free) — the Viking Ship Museum is closed until 2027; this is the substitute."}]},
  {n:"Midday",items:[
   {b:"T-bane to Grünerløkka, lunch at Mathallen",d:"Helt Vilt inside the food hall — wild game burgers. The moose burger or the Arctic Journey tasting platter.",q:"Mathallen Oslo"}]},
  {n:"Afternoon",items:[
   {b:"Grünerløkka wander",d:"Akerselva river path, street art, vintage shops.",q:"Grünerløkka, Oslo"},
   {b:"Tim Wendelboe",d:"Grüners gate 1 — world-renowned Nordic roaster, standing-only. Hot chocolate for the boys.",q:"Tim Wendelboe, Oslo"},
   {b:"Outland Oslo (optional)",d:"Grensen 5–7, ~15 min walk south — Pokémon cards, manga, gaming. The boys' stop for today, a natural break on the way back toward the tram.",q:"Outland Oslo, Grensen"}]},
  {n:"Evening",items:[
   {b:"Tram back to Majorstuen, casual dinner",d:"Cafe Laundromat or Digg Pizza if not used Friday, or self-cater."}]}],
 lore:[
  {t:"One man, two hundred statues",d:"Gustav Vigeland made every sculpture in the park — a lifetime deal: he gave Oslo all his work, Oslo gave him a studio and a park. The Monolith is 121 intertwined figures cut from a single 14-meter granite block; three carvers, fourteen years."},
  {t:"Sinnataggen",d:"The furious little boy is Norway's most famous statue — a bronze toddler mid-tantrum since 1940. His left hand gleams from decades of people grabbing it (don't; it wears him out). Park game: find the statue matching each family member's current mood."}],
 phrase:{p:"Hvor er…?",pr:"voor AIR",e:"Where is…? — pair it with 'toalettet' and the boys are self-sufficient."},
 boys:"Sinnataggen — the angriest toddler in art history (photo op stomping alongside him), a card-shop stop, and hot chocolate at a world-famous roaster. Tomorrow: an actual polar ship.",
 eyes:["Vigeland designed everything in the park down to the lamp posts and gates.","Grünerløkka's street art changes constantly — the boys can hunt for the best piece.","The Akerselva river powered Oslo's whole industrial revolution; the old mills are now studios."],
 customs:"Janteloven — the unwritten Nordic law of modesty. Nobody brags, nobody flexes. It's why service can feel reserved: it's respect, not rudeness.",
 book:[]},

{d:"2026-07-19",dow:"Sun",city:"Oslo",sub:"City spine · Fram Museum · Akershus",r:"capital",
 lede:"The classic city spine, then across the fjord to board two real polar ships: palace park, the main street's ice-cream drift, a moose-sausage lunch, the ferry to the Fram Museum, and rampart-running at a 13th-century fortress to close.",
 blocks:[
  {n:"Morning",items:[
   {b:"Tram 19 to Slottsparken (start ~10 AM)",d:"Royal Palace grounds, free public park. An hour earlier than a lazy Sunday so the Fram afternoon stays unhurried. Glance at the guards on post — Jul 19 is NOT a parade day; the 13:30 handover is a 15-min static swap, not worth planning around.",q:"Slottsparken, Oslo"}]},
  {n:"Midday",items:[
   {b:"Walk down Karl Johans gate",d:"Palace → Stortinget. Shops, street performers, ice cream.",q:"Karl Johans gate, Oslo"},
   {b:"Lunch: Sausage Factory & Wild Factory truck",d:"Rådhusplassen — Norwegian game sausages; the moose sausage with cranberry, caramelized onion and mustard is the signature. Confirm the truck's there day-of (it travels to festivals).",q:"Rådhusplassen, Oslo",a:"Fallback: Oslo Street Food (Torggata 16b, Sun 12–21) — indoor hall, 8 min northeast."}]},
  {n:"Afternoon",items:[
   {b:"Bygdøy ferry from Rådhusbrygge 3 (~1 PM)",d:"City Hall pier 3 — you're already standing there after lunch. Every ~20 min, ~10-min scenic crossing to the museum's doorstep. NOT covered by Ruter: pay by card, ~79 NOK/person each way. Bus 30 is the Ruter-covered alternative both directions.",q:"Rådhusbrygge 3, Oslo"},
   {b:"Fram Museum — the centerpiece [NEW]",d:"Open 9:30–18:00, ~180 NOK/adult, ~70 NOK kids 6–17, no pre-booking. Board TWO original polar ships bow to stern — the Fram (strongest wooden ship ever built) and the Gjøa (first through the Northwest Passage) — plus a polar cold-room simulator and 270° film. Allow 1.5–2 hrs. Rain-proof anchor.",q:"Fram Museum, Oslo",u:"https://frammuseum.no/",a:"Kon-Tiki Museum is 100m away if everyone's captivated — strictly optional, don't force a double-header."},
   {b:"Ferry back → Akershus Fortress (~3:45 PM)",d:"Free grounds, open to 9 PM. The boys run the cobblestone ramparts, harbor views the whole way. 60–90 min is a full visit — it's a wander, not a museum.",q:"Akershus Fortress, Oslo",a:"Energy check: fading after Fram? Shrink this to a 30-min ramble or drop it — you walk past it again Jul 23 pre-cruise. Fram is the must; the fortress is the bonus."}]},
  {n:"Evening",items:[
   {b:"Dinner near the Airbnb + pack",d:"Tomorrow is a moving day — bags mostly closed tonight makes the morning easy."}]}],
 lore:[
  {t:"The fortress never taken",d:"Akershus has guarded Oslo since about 1300 and survived every siege in 700 years. The only time it fell — April 1940 — not a shot was fired at it; the government had already slipped out of the city (thanks, in part, to Wednesday's island). Norway's modern kings rest in the chapel crypt."},
  {t:"A state in one stroll",d:"Royal Palace, Parliament, City Hall — the whole Norwegian state sits along one 20-minute walk, mostly fence-free. Few capitals let you do that on foot."},
  {t:"The ship they froze on purpose",d:"The Fram was built to be trapped: Nansen let the Arctic ice crush-lock the hull so the polar drift would carry the ship across the top of the world. The rounded hull popped up instead of splintering — it worked. Amundsen later sailed her south and beat Scott to the South Pole in 1911. You can walk her decks, cabins and engine room — and next door sits the Gjøa, the little ship that first threaded the Northwest Passage. Two of the most famous ships afloat, and the boys can board both."}],
 phrase:{p:"Regningen, takk",pr:"RYE-ning-en tahk",e:"The bill, please — though in Norway you usually pay at the counter."},
 boys:"Boarding a real polar ship (then a second one), a cold-room that feels like Antarctica, rampart-running at Akershus — and completing the game-meat quest: reindeer dog (Bergen) → moose burger (yesterday) → moose sausage (today).",
 eyes:["Stortinget's lions out front are carved from prison labor's granite — by a convicted counterfeiter.","On the ferry, look back: the city spine you just walked lines up along the harbor.","From the fortress walls, look across to the Opera House roof — you'll be standing on it tomorrow."],
 customs:"No jaywalking, even on an empty street at midnight — Norwegians wait for the green man, and the boys should too.",
 book:[]},

{d:"2026-07-20",dow:"Mon",city:"Oslo → Drøbak",sub:"Opera roof send-off · bus down the fjord",r:"capital",
 lede:"A last Oslo flourish — walking up a building designed to be walked on — then the easy bus down the Oslofjord to a wooden town of galleries and one very famous Santa shop.",
 transit:[{t:"~15:00",l:"Bus 500 Oslo Bussterminal → Drøbak Brygge, ~50 min · every 30 min, Ruter app",ref:"no booking",app:{n:"Ruter",u:"https://ruter.no/en/"}}],
 blocks:[
  {n:"Late morning",items:[
   {b:"Checkout by 12, bags to Oslo S",d:"T-bane Line 1 or 2 from Majorstuen (~10 min). Drop bags at Bounce/Radical Storage near Oslo S (~$13–17 total via app)."},
   {b:"Oslo Opera House roof walk",d:"10-min walk across the pedestrian bridge. Free, open 24/7 — the sloping marble roof was designed to be climbed. Fjord, MUNCH museum and Barcode skyline views. 30–45 min.",q:"Oslo Opera House",a:"If everyone's tired: skip the climb, walk the Bjørvika waterfront instead — same send-off, no slope."}]},
  {n:"Midday",items:[
   {b:"Lunch at Østbanehallen",d:"Food hall inside Oslo S — fast, multiple stalls, zero detour. Then collect bags.",q:"Østbanehallen, Oslo"}]},
  {n:"Late afternoon — Drøbak",items:[
   {b:"Grocery stop: Matkroken, 1 min from the door",d:"Kirkegata 9 — tonight's dinner + tomorrow's picnic. Honest note: it's small and basic (3.5★) but unbeatably close. For a proper full-size shop, Extra Drøbak (Holterveien 2B, 4.2★) is ~20 min north — open to 11 PM Mon–Sat and, rare for Norway, Sundays 9–9.",q:"Matkroken, Kirkegata 9, Drøbak"},
   {b:"Check in 4 PM — Torget 7",d:"Host Åse, on the town square, ~5 min walk from the bus.",q:"Torget 7, Drøbak",ref:"HMJQSM2XHS"}]},
  {n:"Evening",items:[
   {b:"Self-cater dinner + harbor walk",d:"Cheese, charcuterie, local fish cakes, cider. The walk passes Tregaardens Julehus (the year-round Christmas house), the Father Christmas sign, and Drøbak Church (1776).",q:"Tregaardens Julehus, Drøbak"}]}],
 lore:[
  {t:"Santa's official address",d:"Drøbak hosts Norway's Julenissen (Santa) post office — thousands of children's letters addressed to 'Santa, Norway' land here — and Tregaardens Julehus sells Christmas every day of the year. In July this is deeply weird, and therefore great."},
  {t:"Why a town exists here",d:"This is the Oslofjord's narrowest squeeze. When the inner fjord froze, ships unloaded at Drøbak and cargo crossed the ice into Oslo — the capital's winter harbor. That same narrowness becomes the whole story on Wednesday's island."}],
 phrase:{p:"Båt",pr:"bawt",e:"Boat — Drøbak's whole reason for existing."},
 boys:"Running up the Opera House roof — a building you're supposed to climb — then Norway's Christmas headquarters in July.",
 eyes:["Note: the B22 ferry to Drøbak runs weekends only — that's why today is a bus day.","Drøbak was Oslo's winter harbor when the inner fjord froze — the wooden town is largely intact 1700s–1800s."],
 snacks:"At the Drøbak grocery: fresh fiskekaker (fish cakes — pan-fry for dinner), a local Oslofjord-brewery beer, and Smash! (chocolate-covered corn snacks) for the boys.",
 book:[{l:"Drøbak Airbnb · Åse",r:"HMJQSM2XHS"}]},

{d:"2026-07-21",dow:"Tue",city:"Drøbak",sub:"Hugo the wolffish · coast path · fjord sauna",r:"capital",
 lede:"Small-town day, big-memory pieces: a charmingly dated aquarium with a celebrity wolffish, a pine-woods coastal walk to a swimming beach, and a booked fjord-edge sauna staring across at Oscarsborg.",
 blocks:[
  {n:"Late morning",items:[
   {b:"Drøbak Akvarium",d:"Under the Tourist Info at the harbor, ~NOK 40–160. Touch pool, sharks, and Hugo the wolffish — the local celebrity. ~1 hr.",q:"Drøbak Akvarium",a:"Honest expectation: small, dated, charming — recent reviews flag some tank wear. Worth an hour for the touch pool and Hugo; don't expect Bergen polish."}]},
  {n:"Afternoon",items:[
   {b:"Picnic supplies: Håndverksbakeriet",d:"Torggata 6, 3 min away, 8–5 daily. Sandwiches, pizza slices, skolebrød, cinnamon rolls. Anna at the counter gets name-checked in reviews.",q:"Håndverksbakeriet, Drøbak"},
   {b:"Kyststien to Skiphellestranda",d:"~25 min south along the coast path, then pine woods. Swim, rock-sit, picnic. ~2.5–3 mi total, very easy.",q:"Skiphellestranda, Drøbak",a:"Backup: Badeparken + Parrstranda harbor loop — sandy beach, swim ladders, diving towers, playground. Gentler, in town."}]},
  {n:"Late afternoon — SAUNA [book in advance]",items:[
   {b:"Drøbak Badstue",d:"Lehmannsbrygga, ~10 min walk. Fjord-edge sauna with a direct view of Oscarsborg, cold-plunge steps into the Oslofjord. Private for 4: NOK 1,700 / 1.5 hrs weekdays (shared: NOK 250/pp). Open 7 AM–10 PM.",q:"Drøbak Badstue",u:"https://drobakbadstue.no",a:"Skip guilt-free if the walk ran long — pivot to the Airbnb."}]},
  {n:"Evening",items:[
   {b:"Dinner flex (one night out of two)",d:"Default self-cater tonight; if eating out, dgb – Mat & Vinstue is the pick — see tomorrow's Dinner Pool for the full rundown."}]}],
 lore:[
  {t:"Hugo's PR problem",d:"Wolffish look like a nightmare — those teeth are for crushing sea urchins and crabs — but they're famously calm, and Norwegian aquariums keep them as resident personalities. Hugo is the local celebrity. Respect the underbite."}],

{d:"2026-07-22",dow:"Wed",city:"Drøbak",sub:"Oscarsborg — the fortress that sank a warship",r:"capital",
 lede:"The full day on the island: the guns that sank the Blücher on the first morning of Norway's WWII, tunnels to explore, rocks to swim off — then the town's best-fit dinner back on the square.",
 blocks:[
  {n:"Late morning",items:[
   {b:"Ferry to Oscarsborg from Sundbrygga",d:"Main jetty, 5 min from the Airbnb; 5-min crossing. Buy the round-trip QR ticket BEFORE boarding (valid 7 days, not sold onboard), ~NOK 80–100/adult.",q:"Sundbrygga, Drøbak",a:"⚠ Verify the day's departures at the dock on arrival — some sailings require phone pre-booking (+47 900 99 414). Don't get stranded."}]},
  {n:"On the island",items:[
   {b:"Oscarsborg Fortress — free",d:"The 28cm Krupp cannons in their emplacements, the Blücher-sinking museum with the April 9, 1940 video, tunnels, and the island loop walk. 2–3 hrs.",q:"Oscarsborg Fortress"},
   {b:"Island picnic + swim off the rocks",d:"From this morning's groceries and bakery haul. The boys will want the swim if the weather allows."}]},
  {n:"Mid-afternoon",items:[
   {b:"Cake stop: Galleri Cafe Teskje",d:"Niels Carlsens gate 7, Wed 11:30–5. Homemade cakes in an art gallery — strawberries-and-cream is the standout.",q:"Galleri Cafe Teskje, Drøbak",a:"Skip if the island picnic ran heavy."}]},
  {n:"Evening — Drøbak Dinner Pool (pick tonight or self-cater)",items:[
   {b:"dgb – Mat & Vinstue [RECOMMENDED]",d:"Havnebakken 1, on Torget, in an 18th-century bakery. Real kids' menu. The creamy fish soup (349 kr) is the specialty — get one for the table; kids' cheeseburger 175 kr; adults DGB burger or scampi pasta. ~1,200–1,400 kr for four.",q:"dgb Mat og Vinstue, Drøbak"},
   {b:"Kumlegaarden — optional splurge",d:"30 sec away, traditional Norwegian in Drøbak's oldest buildings, fish soup the standout. Mains 398–498 kr (~$170–230 for four) — hold only if you want ONE formal Norwegian dinner this trip. Wednesday works.",q:"Kumlegaarden, Drøbak",a:"Third option: Handelshuset Gastrobar on Torget — candle-lit pizza, daily to 11 PM, ~$60–80 family."}]}],
 warn:"Tomorrow is cruise day — the near-unrecoverable deadline. Tonight: confirm bags are packable by ~11 AM and set the bakery-run plan.",
 lore:[
  {t:"April 9, 1940, 04:21",d:"The German cruiser Blücher led an invasion fleet up the narrows, carrying the troops assigned to seize Norway's king and government. Oscarsborg's commander, Colonel Birger Eriksen, 64, with no clear orders and seconds to decide, fired the fortress's ancient Krupp guns — nicknamed Moses and Aron — and the hidden torpedo battery finished the job. His words became legend: 'Either I will be decorated, or I will be court-martialed. Fire!' The sinking bought the hours that let the King, the government and the gold reserves escape by train."},
  {t:"The wreck below",d:"Blücher still lies ~90 m down, a few hundred meters off the island, quietly seeping oil into the fjord after 86 years. You'll swim within sight of one of WWII's most consequential shipwrecks."}],
 phrase:{p:"Festning",pr:"FEST-ning",e:"Fortress — today's word, today's island."},
 boys:"Standing next to the actual cannons that sank a heavy cruiser at point-blank range on April 9, 1940 — then swimming where it happened.",
 eyes:["The torpedo battery hidden inside the island did the fatal damage — the cannons get the fame.","Blücher still lies on the fjord floor ~90m down, a few hundred meters from where you'll picnic."],
 book:[]},

{d:"2026-07-23",dow:"Thu",city:"Drøbak → Cruise",sub:"Bus to Oslo · board M/S Nordic Pearl",r:"cruise",

   {b:"Perishables run: Coop Mega Aker Brygge",d:"Holmens gate 7, right on the harbor promenade — cheese, charcuterie, fruit, drinks for the cabin picnic. Big and well-stocked (4.2★), ~15 min walk from Vippetangen, so it slots into the pre-boarding stroll. If transit ran late, skip it — the cruise's takeout pizza is the standing backup.",q:"Coop Mega Aker Brygge, Holmens gate 7, Oslo"},

{d:"2026-07-24",dow:"Fri",city:"Copenhagen",sub:"Arrival · Christianshavn · the spire climb · Kanalhuset dinner",r:"denmark",
 lede:"Denmark begins: taxi from the port, harbor-market lunch, and at 1:30 PM the trip's most vertiginous booked moment — 400 steps up Vor Frelsers Kirke, the last 150 winding OUTSIDE the golden spire. Evening closes with a booked communal dinner at Kanalhuset.",

   {b:"Lunch: Broens Gadekøkken",d:"Strandgade 95, from 11 AM. Harbor-side food market — Gasoline Grill burgers, fish & chips, gyros, poke. Eat by ~12:30 so nobody climbs 400 steps hungry.",q:"Broens Gadekøkken, Copenhagen"}]},
  {n:"Afternoon — 13:00 tower [BOOKED]",items:[

  {n:"Evening — 18:30 [BOOKED]",items:[
   {b:"Kanalhuset communal dinner",d:"Overgaden Oven Vandet 62A, ~10 min walk. Confirmed 18:30 seating for 4 (#B:8913319), food served 19:00, shared platters at long communal tables. 175 DKK/pp (~$25), kids under 4 free. Arrive on time — the seating plan is set in advance. Card on file for no-show/late-cancel; pay at the bar on the night.",q:"Kanalhuset, Overgaden Oven Vandet 62A, Copenhagen",a:"Note: confirmation lists 'Quinoa' under allergies — worth confirming that's accurate before the day. Fallback if plans change: Netto smørrebrød night at the Airbnb (herring, smoked salmon, leverpostej, rugbrød)."}]}],
 lore:[
  {t:"A king's copy of Amsterdam",d:"Christianshavn was dug in 1618 by Christian IV as a fortified merchant quarter on the Dutch model — canals, gables, houseboats. Your street stands on 400-year-old reclaimed harbor bottom."},
  {t:"The backwards spiral",d:"Legend: the architect of Vor Frelsers' spire hurled himself from the top after realizing his spiral winds the 'wrong' way. Truth: he died peacefully in bed, years later. But around step 380, outside, in the wind — the legend feels truer."}],
 phrase:{p:"Hej hej",pr:"hi hi",e:"Hello — Danish now. Softer than the Norwegian version; same warmth."},

 customs:"THE Copenhagen rule: bike lanes are not sidewalks. Never step into one without looking — cyclists are fast, silent, and have right of way. Drill the boys on day one.",
 snacks:"Denmark switch at Netto: rugbrød (dense rye), leverpostej for it, flødeboller (chocolate-shelled cream puffs) for the boys, a Tuborg for the adults.",

{d:"2026-07-25",dow:"Sat",city:"Copenhagen",sub:"GoBoat · DØP · Rosenborg · Færgecafé",r:"denmark",
 lede:"The full Copenhagen Saturday: captaining your own boat through the canals, the city's famous organic hot dog, crown jewels behind vault walls, and a 6:30 dinner in a converted ferry.",

 blocks:[
  {n:"Morning",items:[

   {b:"GoBoat 10:45–12:45 [LOCKED]",d:"Self-driven electric boat, no license needed — the boys help steer. Route past Nyhavn, Christiansborg, and your own Christianshavn canals from the water.",q:"GoBoat Islands Brygge, Copenhagen"}]},
  {n:"Midday",items:[
   {b:"Lunch: DØP — the organic hot dog",d:"Amagertorv 31, on Strøget, ~20-min canal walk from GoBoat. The classic Copenhagen pølse with Nordic buns — drier, denser, better. ~$25–35 for four.",q:"DØP Amagertorv, Copenhagen"}]},
  {n:"Afternoon — pre-decided (Jul 3): Rosenborg anchors, Torvehallerne optional",items:[
   {b:"Rosenborg Castle — 2:30 PM booked slot",d:"~12-min walk north from DØP via Købmagergade — no metro needed. Christian IV's Renaissance castle: the Danish crown jewels in the basement vault, three life-size silver lions guarding the thrones. ~1 hr inside; tight and kid-friendly, not a slog. Adults ~130 DKK, under-18 FREE. Timed 10-min entry slots sell out in July — booking the ~2:30 Sat slot in advance is still on the prep list (denkongeligesamling.dk); once booked, walk straight in. Exit through the King's Garden lawns.",q:"Rosenborg Castle, Copenhagen",u:"https://denkongeligesamling.dk/en/rosenborg-castle/tickets/",a:"Bail-out honesty: if the day truly collapses, only the two adult tickets (~260 DKK) are sunk — don't let sunk cost drag a tired family across town. But GoBoat ends 12:45; fading by 2:30 would be unusual."},
   {b:"Torvehallerne — OPTIONAL walk-through only",d:"5-min walk from Rosenborg. Demoted from anchor: a 20–30 min browse only if energy holds — skip freely. Coffee Collective for the adults, Hija de Sanchez tacos if the line moves. The atmosphere is the point; don't shop.",q:"Torvehallerne, Copenhagen"},
   {b:"Faraos Cigarer — arrive by ~4:15",d:"Skindergade 27, Sat 10–5 — arrive by 4:15 to give the boys a real half hour before close. Copenhagen's best comics + Pokémon shop — their reward for tolerating a castle.",q:"Faraos Cigarer, Skindergade 27, Copenhagen"}]},
  {n:"Evening — Dinner [LOCKED 18:30]",items:[
   {b:"Christianshavns Færgecafé",d:"Strandgade 50, 5 min from the Airbnb — boat seating confirmed. Smørrebrød platter, flæskesteg, schnitzel; the converted-ferry atmosphere is the draw. Nyhavn walk-through after if energy holds — the Jazz Festival may have free outdoor sets.",q:"Christianshavns Færgecafé, Copenhagen"}]}],
 lore:[
  {t:"A harbor you can swim in",d:"A generation ago this harbor was industrial soup. Copenhagen cleaned it until it passed swimming standards — the Islands Brygge harbor bath you'll boat past is the proof. Very few capitals let you drive the boat AND swim the water on the same morning."}],
 phrase:{p:"Tak",pr:"tahk (short, soft)",e:"Thanks — Danish drops the extra K sound. Also means please. Danes use it constantly."},
 boys:"Driving the boat. Actually driving it. Then a Pokémon shop and dinner inside a ferry.",
 eyes:["From the water, look for the golden spire you climbed yesterday.","Rosenborg's silver lions have guarded the throne room since the 1660s.","On Strøget, the Stork Fountain is where new midwives traditionally dance."],

{d:"2026-07-26",dow:"Sun",city:"Copenhagen",sub:"Tivoli — afternoon into the lights",r:"denmark",
 lede:"The finale, played correctly: a genuinely lazy morning, pack while fresh, then one entry into Tivoli around 2:30 and ride it straight through dinner into the illuminated gardens. No backtracking, no re-entry, no fireworks-chasing — the lights are the show.",
 blocks:[
  {n:"Morning",items:[
   {b:"Sleep in, slow breakfast, PACK NOW",d:"Bags closed while everyone's fresh keeps tonight and Monday calm. Last Lagkagehuset pastry (Torvegade 45, from 6 AM).",q:"Lagkagehuset Torvegade, Copenhagen",a:"Energetic-morning options (pick at most one): Islands Brygge harbour swim · canal walk with bakery coffee · or just go to Tivoli at noon and slow-play the whole park."}]},
  {n:"Afternoon — Tivoli from ~2:30",items:[
   {b:"Metro to Tivoli",d:"M2 toward København H — main entrance 2 min from Central Station. ~15 min.",q:"Tivoli Gardens, Copenhagen"},
   {b:"Unlimited Ride Pass (~$52/pp) — the right call",d:"Book entry + passes at tivoli.dk. For a 2:30 arrival through an 8-hour evening the boys clear the break-even easily. Download the Tivoli app — ride photos are free via QR.",u:"https://www.tivoli.dk/en"},
   {b:"The hit list",d:"Rutschebanen (1914 wooden coaster with a live brakeman), Himmelskibet Star Flyer (80m swing tower), The Demon (looping coaster). Don't chase all 25 — the gardens, lake and Pantomime Theatre are half the point."}]},
  {n:"Evening — in the park",items:[
   {b:"18:30 — Tivoli Boys Guard parade",d:"100 Danish kids in red tunics and bearskin hats marching to a free concert."},
   {b:"Dinner: Tivoli Food Hall ~7 PM",d:"15 stalls — smørrebrød, sushi, churros. Everyone picks their own; no reservation."},
   {b:"8–11 PM — the payoff",d:"Illuminated gardens after sunset (~9:30). Sunday crowds thin as locals leave — re-ride the coaster lit up, see the Nimb palace and Chinese Pagoda glowing. Leave whenever satisfied; done-at-9:30 is a complete day.",a:"No fireworks tonight (Saturdays only) — deliberately traded for calmer crowds and a gentle lead-in to Monday's flight."}]}],
 warn:"Final bags closed tonight. Monday departs the Airbnb by 11:30 AM latest.",
 lore:[
  {t:"The park that taught Disney",d:"Tivoli opened in 1843 — the world's second-oldest amusement park. Walt Disney visited in the 1950s, took notes, and told his team he wanted Disneyland to feel like this. The 1914 Rutschebanen wooden coaster still carries a human brakeman riding every single train."},
  {t:"Why Sunday night",d:"Evening is Tivoli's real trick: over 100,000 lamps come on and the gardens become the definition of hyggeligt. Sunday closes the weekend — the lines thin out exactly as the lights come up."}],
 phrase:{p:"Hyggeligt",pr:"HOO-guh-lit",e:"Cozy, lovely, warm-hearted — what the lit gardens will be. The most Danish word there is."},
 boys:"A 112-year-old wooden coaster with a human brakeman riding along, then the same rides again after dark with the park glowing.",
 book:[{l:"Tivoli entry + Ride Pass",r:"book: tivoli.dk"}]},

/* ---- shared time helpers ---- */
function localISO(dt){const p=n=>String(n).padStart(2,"0");return dt.getFullYear()+"-"+p(dt.getMonth()+1)+"-"+p(dt.getDate())}
const isToday=day=>localISO(new Date())===day.d;
function hmDate(d,t){const m=(t||"").match(/(\d{1,2}):(\d{2})/);if(!m)return null;return new Date(d+"T"+m[1].padStart(2,"0")+":"+m[2]+":00")}
function nowPeriod(){const h=new Date().getHours();if(h>=5&&h<11)return"morning";if(h>=11&&h<14)return"midday";if(h>=14&&h<18)return"afternoon";if(h>=18)return"evening";return null}

/* ---- travel-day chain / transit ---- */
function transitHTML(day,rc){
 if(!day.transit||!day.transit.length)return"";
 const multi=day.transit.length>=2,live=isToday(day),now=new Date();
 const deps=day.transit.map(t=>hmDate(day.d,t.t));
 let h=`<div class="sec" ${multi?'id="chainSec"':""} style="--rc:${rc}"><h3>${multi?"Travel day — the chain":"Locked transit"}</h3>`;
 if(!multi){
  day.transit.forEach(t=>{h+=`<div class="item"><div class="it"><span class="time">${esc(t.t)}</span><b>${esc(t.l)}</b>
    <div class="desc">${t.ref?`<span class="ref">${esc(t.ref)}</span> `:""}${t.app?`<a class="pill" target="_blank" rel="noopener" href="${esc(t.app.u)}">↗ ${esc(t.app.n)}</a>`:""}</div>
    ${t.fb?`<div class="fbN">${esc(t.fb)}</div>`:""}</div></div>`});
  return h+`</div>`}
 h+=`<div class="chain">`;let nextFound=false;
 day.transit.forEach((t,i)=>{
  const dep=deps[i],arr=t.arr?hmDate(day.d,t.arr):null;
  let st="plan",tag="";
  if(live&&dep){
   const laterStarted=deps.slice(i+1).some(d2=>d2&&now>=d2);
   if((arr&&now>arr)||laterStarted){st="done";tag="done"}
   else if(now>=dep){st="go";tag="en route"}
   else if(!nextFound){st="next";nextFound=true;const ms=dep-now,hh=Math.floor(ms/36e5),mm=Math.floor(ms%36e5/6e4);tag="in "+(hh?hh+"h ":"")+mm+"m"}
  }
  h+=`<div class="leg ${st}"><span class="dot">✓</span><div class="lg">
   <span class="lt">${esc(t.t)}${t.arr?" → "+esc(t.arr):""}</span><b>${esc(t.l)}</b>${tag?`<span class="st">${esc(tag)}</span>`:""}
   <div class="desc" style="font-size:12.5px;color:var(--ink2);margin-top:2px">${t.ref?`<span class="ref">${esc(t.ref)}</span> `:""}${t.app?`<a class="pill" target="_blank" rel="noopener" href="${esc(t.app.u)}">↗ ${esc(t.app.n)}</a>`:""}</div>
   ${t.fb?`<div class="fbN">${esc(t.fb)}</div>`:""}</div></div>`;
  const nx=deps[i+1];
  if(arr&&nx){const bm=Math.round((nx-arr)/6e4);if(bm>0&&bm<720)h+=`<div class="buffer">⟟ ${bm} min buffer</div>`}
 });
 return h+`</div></div>`}
